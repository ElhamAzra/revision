/* js/generators/sys.js */
/* Générateurs systèmes : chmod, umask, crontab, RAID, sauvegardes, disponibilité. */
(function () {
  'use strict';
  const App = window.App;
  const U = App.util;
  const G = App.gen;
  const md = App.md;
  const sym = (o, d) => App.sys.symbolic(o, d);

  /* Comparaison sémantique de lignes cron (5 champs) */
  function expand(f, lo, hi) {
    const out = new Set();
    f.split(',').forEach((part) => {
      let [range, step] = part.split('/');
      step = step ? +step : 1;
      let a = lo, b = hi;
      if (range !== '*') {
        if (range.includes('-')) [a, b] = range.split('-').map(Number);
        else { a = +range; b = step > 1 ? hi : a; }
      }
      for (let x = a; x <= b; x += step) out.add(x);
    });
    return out;
  }
  function cronSets(line) {
    const p = String(line).trim().split(/\s+/);
    if (p.length < 5) return null;
    try {
      const dow = expand(p[4], 0, 7);
      if (dow.has(7)) { dow.delete(7); dow.add(0); }
      return [expand(p[0], 0, 59), expand(p[1], 0, 23), expand(p[2], 1, 31), expand(p[3], 1, 12), dow];
    } catch (e) { return null; }
  }
  App.quiz.fieldCheckers.cron = (v, f) => {
    const a = cronSets(v), b = cronSets(f.a);
    if (!a || !b) return false;
    return a.every((s, i) => s.size === b[i].size && [...s].every((x) => b[i].has(x)));
  };

  G.register({
    id: 'chmod', mod: 's7', icon: '🔐', title: 'Droits Linux : rwx ↔ octal',
    desc: 'r = 4, w = 2, x = 1, plus SUID / SGID / sticky.',
    make(r, lvl) {
      const common = ['755', '644', '640', '750', '700', '600', '775', '664', '660', '770', '711', '444', '555', '751', '740', '604'];
      if (lvl === 3) {
        const o = r.pick(['4755', '2770', '1777', '2755', '3770', '4750', '1755', '2750', '6755']);
        const dir = /^[123]/.test(o) && o !== '4755';
        if (r.chance(0.5)) return { q: `Valeur octale de <b class="mono">${sym(o, dir)}</b> ?`, fields: [{ kind: 'text', a: o, ph: '4 chiffres' }], expl: expl(o, dir) };
        return { q: `Que donne <b class="mono">ls -l</b> pour un ${dir ? 'dossier' : 'fichier'} en <b>${o}</b> ? (10 caractères)`, fields: [{ kind: 'code', a: sym(o, dir), ph: dir ? 'drwx…' : '-rwx…' }], expl: expl(o, dir) };
      }
      const o = r.pick(common);
      if (lvl === 1 || r.chance(0.5)) return { q: `Valeur octale de <b class="mono">${sym(o).slice(1)}</b> ?`, fields: [{ kind: 'text', a: o, ph: 'ex. 750' }], expl: expl(o) };
      return { q: `Écris en symbolique (9 caractères rwx) le droit <b>${o}</b>.`, fields: [{ kind: 'code', a: sym(o).slice(1), ph: 'rwxr-x---' }], expl: expl(o) };
      function expl(oc, d) {
        const n = parseInt(oc, 8);
        const t = (v) => `${v & 4 ? 'r' : '-'}${v & 2 ? 'w' : '-'}${v & 1 ? 'x' : '-'} = ${v & 4 ? 4 : 0}+${v & 2 ? 2 : 0}+${v & 1 ? 1 : 0} = <b>${v}</b>`;
        const sp = (n >> 9) & 7;
        return md.ul([`Propriétaire : ${t((n >> 6) & 7)}`, `Groupe : ${t((n >> 3) & 7)}`, `Autres : ${t(n & 7)}`].concat(sp ? [`Spécial : ${sp & 4 ? 'SUID 4000 ' : ''}${sp & 2 ? 'SGID 2000 ' : ''}${sp & 1 ? 'sticky 1000' : ''} → s/t remplace le x (majuscule S/T si x absent)`] : [])) + `<p class="mono"><b>${sym(oc, d)}</b> = ${oc}</p>`;
      }
    },
    quick(r) {
      const o = r.pick(['755', '644', '640', '750', '700', '600', '775', '660']);
      return { q: `<b class="mono">${sym(o).slice(1)}</b> en octal ?`, fields: [{ kind: 'text', a: o }], expl: o };
    }
  });

  G.register({
    id: 'umask', mod: 's7', icon: '🎭', title: 'umask',
    desc: 'Droits par défaut : 666 (fichiers) et 777 (dossiers) moins le umask.',
    make(r) {
      const u = r.pick(['022', '027', '077', '002', '007', '026']);
      const f = (0o666 & ~parseInt(u, 8)).toString(8).padStart(3, '0'), d = (0o777 & ~parseInt(u, 8)).toString(8).padStart(3, '0');
      return {
        q: `Avec un <b>umask ${u}</b>, quels droits octaux aura un nouveau fichier ? Un nouveau dossier ?`,
        fields: [{ label: 'Fichier', kind: 'text', a: f }, { label: 'Dossier', kind: 'text', a: d }],
        expl: md.steps([`Fichier : 666 − ${u} → <b>${f}</b> (${sym(f).slice(1)})`, `Dossier : 777 − ${u} → <b>${d}</b> (${sym(d, true).slice(1)})`]) + md.trap('On part de 666 pour un fichier : un fichier n\'est jamais exécutable par défaut.')
      };
    },
    quick(r) {
      const u = r.pick(['022', '027', '077']);
      const f = (0o666 & ~parseInt(u, 8)).toString(8).padStart(3, '0');
      return { q: `umask ${u} → droits d'un nouveau fichier ?`, fields: [{ kind: 'text', a: f }], expl: f };
    }
  });

  const CRON = [
    ['30 23 * * *', 'tous les jours à 23 h 30'],
    ['0 2 * * *', 'tous les jours à 2 h 00'],
    ['*/15 8-17 * * 1-5', 'toutes les 15 minutes de 8 h à 17 h 45, du lundi au vendredi'],
    ['*/10 7-17 * * 1-5', 'toutes les 10 minutes de 7 h à 17 h 50, du lundi au vendredi'],
    ['0 6 1 * *', 'le 1er de chaque mois à 6 h'],
    ['0 0 * * 0', 'chaque dimanche à minuit'],
    ['0 21 * * 1-5', 'du lundi au vendredi à 21 h'],
    ['15 3 1,15 * *', 'le 1er et le 15 de chaque mois à 3 h 15'],
    ['0 */4 * * 6,0', 'toutes les 4 heures pile, le samedi et le dimanche'],
    ['45 12 * * 5', 'chaque vendredi à 12 h 45'],
    ['0 8 * 1 *', 'tous les jours de janvier à 8 h'],
    ['5 0 * * *', 'tous les jours à 0 h 05'],
    ['0 18 * * 1', 'chaque lundi à 18 h'],
    ['30 7 * * 1,3,5', 'lundi, mercredi et vendredi à 7 h 30']
  ];
  G.register({
    id: 'cron-read', mod: 's7', icon: '⏰', title: 'Crontab : lire et écrire',
    desc: 'minute · heure · jour du mois · mois · jour de semaine (0 = dimanche).',
    make(r, lvl) {
      const c = r.pick(CRON);
      if (lvl === 1 || (lvl === 2 && r.chance(0.5))) {
        const others = r.shuffle(CRON.filter((x) => x !== c)).slice(0, 3);
        const ch = r.shuffle([c].concat(others));
        return { type: 'qcm', q: `Que signifie <b class="mono">${c[0]} /opt/script.sh</b> ?`, choices: ch.map((x) => x[1]), a: ch.indexOf(c), expl: md.table(['min', 'heure', 'jour mois', 'mois', 'jour sem.'], [c[0].split(' ')]) + md.trap('L\'ordre est minute PUIS heure : « 0 2 » = 2 h 00, pas 0 h 02.') };
      }
      return {
        q: `Écris les <b>5 champs</b> de crontab pour exécuter une tâche <b>${c[1]}</b>.`,
        fields: [{ kind: 'cron', a: c[0], ph: 'min heure jm mois js', wide: true }],
        expl: `<p class="mono"><b>${c[0]}</b></p>` + md.table(['Champ', 'Valeurs'], [['minute', '0-59'], ['heure', '0-23'], ['jour du mois', '1-31'], ['mois', '1-12'], ['jour de la semaine', '0-7 (0 et 7 = dimanche, 1 = lundi)']]) + md.tip('*/15 = toutes les 15 · 1-5 = du lundi au vendredi · 1,15 = le 1er et le 15.')
      };
    },
    quick(r) {
      const c = r.pick(CRON);
      const others = r.shuffle(CRON.filter((x) => x !== c)).slice(0, 3);
      const ch = r.shuffle([c].concat(others));
      return { type: 'qcm', q: `<b class="mono">${c[0]}</b> = ?`, choices: ch.map((x) => x[1]), a: ch.indexOf(c), expl: c[1] };
    }
  });

  G.register({
    id: 'raid', mod: 's8', icon: '💽', title: 'RAID : capacité et pannes',
    desc: 'RAID 0 / 1 / 5 / 6 / 10.',
    make(r, lvl) {
      const n = r.pick([4, 4, 6, 6, 8]), s = r.pick([1, 2, 4, 8]);
      const L = [['RAID 0', n * s, 0], ['RAID 5', (n - 1) * s, 1], ['RAID 6', (n - 2) * s, 2], ['RAID 10', (n / 2) * s, 1], ['RAID 1', (n / 2) * s, 1]];
      const x = lvl === 1 ? r.pick(L.slice(0, 3)) : r.pick(L);
      return {
        q: `<b>${n} disques de ${s} To</b> en <b>${x[0]}</b> : capacité utile (To) et nombre de pannes de disque tolérées (garanties) ?`,
        fields: [{ label: 'Capacité (To)', kind: 'num', a: x[1] }, { label: 'Pannes tolérées', kind: 'num', a: x[2] }],
        expl: md.table(['RAID', 'Capacité', 'Pannes'], [['0', 'N', '0'], ['1', 'N/2', '1 par miroir'], ['5', 'N − 1', '1'], ['6', 'N − 2', '2'], ['10', 'N/2', '1 garantie (jusqu\'à N/2)']]) + `<p>${x[0]} avec ${n} × ${s} To → <b>${x[1]} To</b>, <b>${x[2]}</b> panne(s).</p>`
      };
    }
  });

  G.register({
    id: 'backup', mod: 's8', icon: '🗄️', title: 'Sauvegardes : que restaurer ?',
    desc: 'Complète, incrémentielle, différentielle, données perdues.',
    make(r) {
      const J = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
      const full = r.pick([0, 6]);
      const failDay = (full + r.int(2, 5)) % 7;
      const h = r.pick([20, 22]);
      const failH = r.pick([9, 10, 11, 14, 15]);
      const type = r.pick(['incrémentielles', 'différentielles']);
      const days = [];
      for (let d = (full + 1) % 7; d !== failDay; d = (d + 1) % 7) days.push(J[d]);
      const last = days[days.length - 1];
      const lost = 24 - h + failH;
      const good = type === 'incrémentielles' ? `La complète de ${J[full]} + les incrémentielles de ${days.join(', ')} (dans l'ordre)` : `La complète de ${J[full]} + la différentielle de ${last} seulement`;
      const bad1 = type === 'incrémentielles' ? `La complète de ${J[full]} + l'incrémentielle de ${last} seulement` : `La complète de ${J[full]} + toutes les différentielles (${days.join(', ')})`;
      const ch = [good, bad1, `La dernière sauvegarde (${last}) seulement`, `La complète de ${J[full]} seulement`];
      return {
        q: `Complète le <b>${J[full]}</b> à ${h} h, puis des <b>${type}</b> chaque soir à ${h} h. Le disque tombe en panne le <b>${J[failDay]} à ${failH} h</b>. Que faut-il restaurer, et combien d'heures de données sont perdues ?`,
        type: 'input',
        fields: [{ label: 'À restaurer', kind: 'select', opts: ch, a: 0, wide: true }, { label: 'Heures perdues', kind: 'num', a: lost }],
        expl: md.ul(['<b>Incrémentielle</b> = depuis la dernière sauvegarde (quelle qu\'elle soit) → restaurer la complète + TOUTES les incrémentielles.', '<b>Différentielle</b> = depuis la dernière complète → restaurer la complète + la DERNIÈRE différentielle.']) + `<p>Perte : du ${last} ${h} h au ${J[failDay]} ${failH} h = <b>${lost} h</b> (le RPO de 24 h est ${lost <= 24 ? 'respecté' : 'dépassé'}).</p>`
      };
    }
  });

  G.register({
    id: 'dispo', mod: 's8', icon: '⏱️', title: 'Disponibilité (%)',

      const x = r.pick([[99, 87.6, 'h'], [99.5, 43.8, 'h'], [99.9, 8.76, 'h'], [99.99, 52.56, 'min'], [99.95, 4.38, 'h']]);
      return {
        q: `Un contrat garantit <b>${U.fmtNum(x[0])} %</b> de disponibilité. Combien d'arrêt est autorisé par an (en ${x[2] === 'h' ? 'heures' : 'minutes'}) ?`,

      };
    }
  });
})();

${table(['Position', '7', '6', '5', '4', '3', '2', '1', '0'], [['Puissance', '2<sup>7</sup>', '2<sup>6</sup>', '2<sup>5</sup>', '2<sup>4</sup>', '2<sup>3</sup>', '2<sup>2</sup>', '2<sup>1</sup>', '2<sup>0</sup>'], ['<b>Poids</b>', '<b>128</b>', '<b>64</b>', '<b>32</b>', '<b>16</b>', '<b>8</b>', '<b>4</b>', '<b>2</b>', '<b>1</b>']])}

        html: `

<h3>Écrire et compresser</h3>
${ex(`<span class="mono">2001:0DB8:0000:0000:0000:FF00:0042:8329</span><br>

Règle 2 (« :: » une seule fois) : <b class="mono">2001:db8::ff00:42:8329</b>`, 'Compression en 2 règles')}
${ex(`<span class="mono">2001:0db8:0000:0001:0000:0000:0000:0001</span> → <b class="mono">2001:db8:0:1::1</b> : le « :: » remplace la plus longue suite (groupes 5 à 7), le 0 isolé du 3<sup>e</sup> groupe reste « 0 ».`)}
${trap('<b>2001:db8::1::5</b> est invalide : avec deux « :: », impossible de savoir combien de groupes chacun remplace (le cours cite 2001:DB8::1234::5678).')}

<h3>EUI-64 pas à pas</h3>
${stepper([
  `<p>MAC : <b class="mono">00:1A:2B:3C:4D:5E</b>. On la coupe en deux : 00:1A:2B | 3C:4D:5E.</p>`,

], 'EUI-64')}
${tip('Inverser le 7<sup>e</sup> bit = ajouter ou retirer 2 au 1<sup>er</sup> octet : 00 → 02, 0C → 0E, 02 → 00, A4 → A6.')}

          { q: 'b) Trame 2 : taguée ? VLAN et priorité ? Protocole transporté ?', pts: 0.75, fields: [{ label: 'N° de VLAN', kind: 'num', a: 10 }, { label: 'Priorité (PCP)', kind: 'num', a: 0 }], corr: '<p>0x8100 → taguée 802.1Q. TCI = 00 0a = 0000 0000 0000 1010 → PCP = 000 (priorité 0), DEI = 0, VID = 0x00A = <b>VLAN 10</b>. EtherType suivant 0x0800 = IPv4 ; 45 = version 4, en-tête de 20 octets.</p>' },
          { q: 'c) Quel type d\'adresse est 01:00:5E:00:00:05 ? Que signifie l\'OUI 00:1A:2B ?', pts: 0.75, corr: '<p>Multicast IPv4 (1<sup>er</sup> octet avec son dernier bit à 1) : groupe 224.0.0.5 (tous les routeurs OSPF). L\'OUI = les 24 premiers bits, identifiant du constructeur attribué par l\'IEEE.</p>' },
          { q: 'd) Pourquoi une trame doit-elle faire au moins 64 octets ? Que fait la carte si les données sont trop courtes ?', pts: 0.75, corr: '<p>Pour que l\'émetteur soit encore en train d\'émettre quand une collision revient (CSMA/CD, 2 500 m à 10 Mbit/s : 512 bits). Moins de 46 octets de données → <b>bourrage (padding)</b>.</p>' }
        ]
      },
      {
        title: 'Étude de cas : VLAN au siège de Niamey', min: 12, src: 'Plan S3 · Ex. 4',
        statement: `<p>Un switch d'accès SW-NY relie les postes ; un seul lien (G0/1 du switch ↔ G0/0 du routeur) remonte vers R-NIAMEY.</p>${table(['VLAN', 'Nom', 'Ports', 'Sous-réseau', 'Passerelle'], [['10', 'ADMIN', 'Fa0/1 à Fa0/12', '10.20.0.0/23', '10.20.0.1'], ['20', 'IMPOTS', 'Fa0/13 à Fa0/22', '10.20.2.0/24', '10.20.2.1'], ['99', 'GESTION', '— (adresse du switch)', '10.20.3.240/28', '10.20.3.241'], ['999', 'NATIF', 'VLAN natif inutilisé', '—', '—']])}`,
        parts: [
          { q: 'a) Configuration du switch (VLAN, ports access, trunk, adresse de gestion 10.20.3.242, passerelle).', pts: 2, corr: code(`vlan 10
 name ADMIN
vlan 20
 name IMPOTS
vlan 99
 name GESTION
vlan 999
 name NATIF
interface range fa0/1 - 12
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
interface range fa0/13 - 22
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
interface g0/1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport nonegotiate
interface vlan 99
 ip address 10.20.3.242 255.255.255.240
 no shutdown
ip default-gateway 10.20.3.241
! ports Fa0/23-24 inutilisés : VLAN inutilisé + shutdown`) },
          { q: 'b) Configuration du routeur (router-on-a-stick).', pts: 1.5, corr: code(`interface g0/0
 no shutdown
interface g0/0.10
 encapsulation dot1Q 10
 ip address 10.20.0.1 255.255.254.0
interface g0/0.20
 encapsulation dot1Q 20
 ip address 10.20.2.1 255.255.255.0
interface g0/0.99
 encapsulation dot1Q 99
 ip address 10.20.3.241 255.255.255.240`) },
          { q: 'c) Pourquoi déplacer le VLAN natif vers 999 ? Pourquoi nonegotiate et portfast ?', pts: 1, corr: '<p>Natif 999 : il circule sans tag ; laissé en VLAN 1, un attaquant peut faire du VLAN hopping (double étiquetage). <code>nonegotiate</code> désactive DTP : personne ne peut monter un trunk lui-même. <code>portfast</code> : accès immédiat au lieu d\'attendre 30 s (sinon le DHCP peut échouer au démarrage).</p>' },
          { q: 'd) Le lien G0/1 est saturé. Deux améliorations ?', pts: 0.5, corr: '<p>(1) EtherChannel LACP (2 à 4 liens) ; (2) switch de niveau 3 (SVI + ip routing) ; (3) lien 10 Gbit/s.</p>' }
        ]
      },
      {
        title: 'Spanning Tree', min: 10, src: 'Plan S3 · Ex. 5',
        statement: '<p>Trois switchs en triangle, liens 1 Gbit/s : SW1 (priorité 32 768, MAC 0011.1111.1111) · SW2 (4 096, 0011.2222.2222) · SW3 (32 768, 0011.0000.0001). Essaie le lab « Élection STP » pour vérifier.</p>',
        parts: [
          { q: 'a) Quel switch est pont racine ? Pourquoi ?', pts: 1, fields: [{ kind: 'select', opts: ['SW1', 'SW2', 'SW3'], a: 1 }], corr: '<p>SW2 : sa priorité (4 096) est la plus faible → plus petit Bridge ID, quelle que soit sa MAC.</p>' },
          { q: 'b) Port racine de chaque switch non racine (coût vers la racine).', pts: 1, corr: '<p>SW1 : port vers SW2 (coût 4, contre 4 + 4 = 8 via SW3) · SW3 : port vers SW2 (coût 4).</p>' },
          { q: 'c) Sur le lien SW1–SW3, quel port est désigné, lequel est bloqué ?', pts: 1, fields: [{ label: 'Port bloqué', kind: 'select', opts: ['côté SW1', 'côté SW3'], a: 0 }], corr: '<p>Égalité de coût vers la racine (4). On compare les Bridge ID : même priorité, MAC de SW3 (0011.0000.0001) &lt; SW1 → le port de SW3 est désigné, celui de <b>SW1 est bloqué</b>.</p>' },
          { q: 'd) Sans modification des priorités, qui serait racine ? Quelle commande rend SW1 racine ?', pts: 0.5, corr: '<p>Toutes à 32 768 → plus petite MAC → <b>SW3</b>. Pour SW1 : <code>spanning-tree vlan 1 root primary</code> ou <code>spanning-tree vlan 1 priority 0</code> (ou 4096 ; multiple de 4 096).</p>' },
          { q: 'e) Temps pour remettre un port bloqué en service en 802.1D ? Version plus rapide ?', pts: 0.5, corr: '<p>802.1D : jusqu\'à 50 s (20 max age + 15 listening + 15 learning), 30 s si la panne est détectée directement. <b>RSTP (802.1w)</b> : ~1 s (ports alternate, négociation proposition/accord).</p>' }
        ]
      },
      {
        title: 'Étude de cas Wi-Fi : direction régionale de Tahoua', min: 6, src: 'Plan S3 · Ex. 6',
        statement: '<p>3 bornes Wi-Fi dans un bâtiment de bureaux : agents (applications financières) et visiteurs (Internet uniquement).</p>',
        parts: [
          { q: 'a) Quels canaux pour les 3 bornes en 2,4 GHz ? Pourquoi ?', pts: 1, corr: '<p>1, 6 et 11 : seuls canaux de 20 MHz sans chevauchement ; deux bornes voisines sur des canaux qui se chevauchent se brouillent.</p>' },
          { q: 'b) Sécurité pour les agents et les visiteurs ? Comment isoler les visiteurs ?', pts: 1, corr: '<p>Agents : WPA2/WPA3-Entreprise (802.1X + RADIUS relié à l\'AD, identifiant révocable). Visiteurs : SSID séparé, WPA3-Personnel ou portail captif. Isolation : VLAN dédié routé uniquement vers Internet (ACL/pare-feu interdisant 10.20.0.0/22), isolation des clients entre eux.</p>' },
          { q: 'c) Pourquoi CSMA/CA et non CSMA/CD ?', pts: 1, corr: '<p>Une station radio ne peut pas écouter pendant qu\'elle émet (son propre signal couvre tout) → impossible de détecter une collision ; on cherche donc à l\'éviter (attente aléatoire, ACK, RTS/CTS).</p>' }
        ]
      }
    ],

      'Chaque port de switch = 1 domaine de collision ; chaque interface de routeur (ou chaque VLAN) = 1 domaine de broadcast.',

      'Wi-Fi : CSMA/CA, canaux 1-6-11, WPA3 = SAE, Entreprise = 802.1X + RADIUS.'
    ]
  });

  <script>
/* js/controllers/runner.js */
/* Contrôleur : session de questions (pratique, défi éclair) — progression, combo, XP, bilan. */
(function () {
  'use strict';
  const App = window.App;
  const U = App.util;

  const runner = (App.runner = {
    /* opts : { title, crumbs, questions | next(), count, mode, time, recordKey, onFinish, intro, backHref, retry() } */
    start(opts) {
      const mode = opts.mode || 'practice';
      const infinite = !opts.questions && (opts.count == null || opts.count === Infinity);
      const total = opts.questions ? opts.questions.length : infinite ? Infinity : opts.count;
      const S = { idx: 0, results: [], combo: 0, maxCombo: 0, xp: 0, t0: Date.now(), score: 0, done: false, current: null, advancing: false };
      let timerId = null, timeLeft = opts.time || 0;

      const v = App.ui.mount(`
        ${opts.crumbs ? App.ui.crumbs(opts.crumbs) : ''}
        <div class="page-head"><h1>${opts.title}</h1>${opts.sub ? `<div class="sub">${opts.sub}</div>` : ''}</div>
        <div class="quiz-top">
          <span class="small muted nowrap" id="qCount"></span>
          ${infinite && mode !== 'blitz' ? '<span class="grow"></span>' : App.ui.bar(0)}
          ${mode === 'blitz' ? '<span class="timer" id="qTimer">0:00</span>' : ''}
          <span class="combo" id="qCombo"></span>
          ${mode !== 'blitz' ? '<button class="btn sm ghost" id="qEnd">Terminer</button>' : ''}
        </div>
        <div id="qHost"></div>`);
      App.layout.setTitle(opts.title.replace(/<[^>]+>/g, ''));
      const host = v.querySelector('#qHost');
      const bar = v.querySelector('.quiz-top .bar > i');
      const endBtn = v.querySelector('#qEnd');
      if (endBtn) endBtn.addEventListener('click', () => finish());

      App.ui.keys({ Enter: (e) => S.current && S.current.key(e), default: null });
      const onKey = (e) => { if (e.key !== 'Enter' && S.current) S.current.key(e); };
      document.addEventListener('keydown', onKey);
      App.router.onLeave(() => { document.removeEventListener('keydown', onKey); clearInterval(timerId); S.done = true; });

      function updateTop() {
        const cnt = v.querySelector('#qCount');
        if (mode === 'blitz') cnt.innerHTML = `Score <b class="pri-t" style="font-size:1.1rem">${S.score}</b>`;
        else cnt.textContent = infinite ? `${S.results.filter((r) => r.ok).length} ✓ / ${S.results.length}` : `${Math.min(S.idx + 1, total)} / ${total}`;
        if (bar && !infinite) bar.style.width = Math.round((S.results.length / total) * 100) + '%';
        const c = v.querySelector('#qCombo');
        if (S.combo >= 3) {
          const m = App.game.comboMult(S.combo);
          c.innerHTML = `<span class="flame">🔥</span>×${S.combo}${m > 1 ? ` <span class="chip acc">XP ×${m}</span>` : ''}`;
          c.classList.remove('big'); void c.offsetWidth; c.classList.add('big');
        } else c.innerHTML = '';
      }

      function getQ(i) {
        if (opts.questions) return opts.questions[i];
        return opts.next(i);
      }

      function show() {
        if (S.done) return;
        if (!infinite && S.idx >= total) return finish();
        const q = getQ(S.idx);
        if (!q) return finish();
        S.advancing = false;
        const api = App.qview.create(q, {
          mode: mode === 'blitz' ? 'blitz' : 'practice',
          onAnswer: (res, resp) => answered(q, res, resp, api),
          onNext: () => next()
        });
        S.current = api;
        host.innerHTML = '';
        host.appendChild(api.el);
        App.ui.hydrate(api.el);
        api.focus();
        updateTop();
      }

      function answered(q, res, resp, api) {
        S.results.push({ q, ok: res.ok, score: res.score, resp, skipped: !!res.skipped });
        if (res.ok) {
          S.combo++;
          S.maxCombo = Math.max(S.maxCombo, S.combo);
          S.score++;
          App.fx.sound(S.combo >= 5 && S.combo % 5 === 0 ? 'combo' : 'ok');
          if (S.combo === 10) App.game.award('combo10');
          if (S.combo === 25) App.game.award('combo25');
        } else {
          S.combo = 0;
          App.fx.sound('ko');
          App.fx.vibrate(80);
        }
        const xp = App.quiz.xpFor(q, res, S.combo);
        S.xp += xp;
        App.progress.record(q, res.ok, { noErrorLog: opts.noErrorLog || res.score > 0.99 });
        App.game.addXP(xp, api.el.querySelector('.q-text'));
        updateTop();
        if (mode === 'blitz') setTimeout(() => next(), res.ok ? 380 : 1500);
      }

      function next() {
        if (S.advancing || S.done) return;
        S.advancing = true;
        S.idx++;
        show();
      }

      function finish() {
        if (S.done) return;
        S.done = true;
        clearInterval(timerId);
        document.removeEventListener('keydown', onKey);
        const n = S.results.length;
        const ok = S.results.filter((r) => r.ok).length;
        const pct = n ? ok / n : 0;
        const secs = (Date.now() - S.t0) / 1000;
        let record = false;
        if (mode === 'blitz' && opts.recordKey) {
          const rec = App.store.state.records;
          if (!rec[opts.recordKey] || S.score > rec[opts.recordKey]) { record = !!rec[opts.recordKey] || S.score > 0; rec[opts.recordKey] = S.score; }
          if (S.score >= 15) App.game.award('blitz15');
          if (S.score >= 30) App.game.award('blitz30');
          App.store.save();
        }
        if (n >= 10 && ok === n) App.game.award('perfect');
        const summary = { n, ok, pct, xp: S.xp, maxCombo: S.maxCombo, secs, results: S.results, score: S.score };
        if (opts.onFinish) opts.onFinish(summary);
        App.fx.sound('end');
        if (pct >= 0.8 && n >= 5) App.fx.confetti(0.8);
        const emoji = n === 0 ? '👋' : pct >= 0.9 ? '🏆' : pct >= 0.7 ? '🎉' : pct >= 0.5 ? '💪' : '📚';
        const msg = n === 0 ? 'Aucune réponse cette fois.' : pct >= 0.9 ? 'Excellent ! Tu maîtrises.' : pct >= 0.7 ? 'Très bien ! Encore un effort sur les erreurs ci-dessous.' : pct >= 0.5 ? 'C\'est en bonne voie. Relis les explications des erreurs.' : 'Chaque erreur est une leçon : elles sont dans ton carnet, on les reverra.';
        const wrong = S.results.filter((r) => !r.ok);
        v.innerHTML = `
          ${opts.crumbs ? App.ui.crumbs(opts.crumbs) : ''}
          <div class="card pad-lg center">
            <div class="big-emoji" style="font-size:3.6rem">${emoji}</div>
            <h1 class="mt1">${mode === 'blitz' ? `Score : ${S.score}` : `${ok} / ${n} bonnes réponses`}</h1>
            ${record ? '<div class="chip acc mb1">🏅 Nouveau record personnel !</div>' : ''}
            <p class="muted">${msg}</p>
            <div class="grid c3 mt2" style="max-width:520px;margin-left:auto;margin-right:auto">
              <div class="kpi" style="justify-content:center"><div><div class="v pri-t">+${S.xp}</div><div class="l">XP gagnés</div></div></div>
              <div class="kpi" style="justify-content:center"><div><div class="v acc-t">🔥 ${S.maxCombo}</div><div class="l">meilleur combo</div></div></div>
              <div class="kpi" style="justify-content:center"><div><div class="v">${U.fmtDuration(secs)}</div><div class="l">durée</div></div></div>
            </div>
            <div class="row mt3" style="justify-content:center">
              ${opts.retry ? '<button class="btn primary" data-retry>🔁 Recommencer</button>' : ''}
              ${wrong.length ? '<a class="btn soft" href="#/erreurs">🩹 Voir le carnet d\'erreurs</a>' : ''}
              <a class="btn" href="${opts.backHref || '#/entrainement'}">Retour</a>
            </div>
          </div>
          ${wrong.length ? `<h2 class="mt3">À revoir (${wrong.length})</h2>
            <div class="stack">${wrong.map((r) => `<div class="card"><div class="q-text" style="font-size:1rem">${r.q.q}</div>
              <div class="fb ko" style="margin-top:.4rem"><div class="fb-h" style="font-size:.95rem">Réponse : ${U.esc(answerOf(r.q)).replace(/&lt;(\/?(b|sup|sub|code|i))&gt;/g, '<$1>')}</div><div class="expl prose">${r.q.expl || ''}</div></div></div>`).join('')}</div>` : ''}`;
        App.ui.hydrate(v);
        const rb = v.querySelector('[data-retry]');
        if (rb) rb.addEventListener('click', () => opts.retry());
        window.scrollTo(0, 0);
      }

      function answerOf(q) {
        if (q.type === 'qcm') return q.choices[q.a].replace(/<[^>]+>/g, '');
        if (q.type === 'multi') return q.a.map((i) => q.choices[i]).join(' + ').replace(/<[^>]+>/g, '');
        if (q.type === 'tf') return q.a ? 'Vrai' : 'Faux';
        if (q.type === 'order') return q.items.join(' → ').replace(/<[^>]+>/g, '');
        if (q.type === 'match') return q.pairs.map((p) => p[0] + ' → ' + p[1]).join(' · ').replace(/<[^>]+>/g, '');
        if (q.type === 'input') return q.fields.map((f) => (f.label ? f.label.replace(/<[^>]+>/g, '') + ' : ' : '') + App.quiz.expected(f)).join(' · ');
        return '';
      }

      if (mode === 'blitz') {
        timeLeft = opts.time || 60;
        const tEl = v.querySelector('#qTimer');
        const tick = () => {
          tEl.textContent = U.fmtDuration(timeLeft);
          tEl.classList.toggle('low', timeLeft <= 10);
          if (timeLeft <= 0) { finish(); return; }
          timeLeft--;
        };
        tick();
        timerId = setInterval(tick, 1000);
      }
      show();
      return S;
    }
  });
})();

</script>

      ${App.ui.crumbs([['Cours', '#/cours'], [m.short || m.title]])}

        <div class="row nowrap" style="align-items:flex-start">
          <span class="m-ico" style="width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:1.8rem;background:color-mix(in srgb, ${m.color} 16%, var(--surface));flex:none">${m.icon}</span>
          <div class="grow">
            <div class="tiny" style="font-weight:800;color:${m.color};text-transform:uppercase;letter-spacing:.06em">${m.label}${m.day ? ' · ' + U.fmtDay(m.day) : ''}${m.epreuve ? ' · ' + m.epreuve : ''}</div>

            <div class="muted">${m.subtitle || ''}</div>

      <div class="tabs mt2">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${body}`);
    U.$$('.tabs button').forEach((b) => b.addEventListener('click', () => R.go(`/cours/${m.id}?tab=${b.dataset.tab}`)));
  }, { keepScroll: false });

  function hintOf(ph) {
    const words = ph.replace(/<[^>]+>/g, '').split(/\s+/);
    return '« ' + words.slice(0, 4).join(' ') + ' … »';
  }

  function genCard(g) {
    const s = App.store.state.genStats[g.id];
    return `<a class="card hover" href="#/gen/${g.id}" style="color:inherit;text-decoration:none"><div class="row nowrap"><span style="font-size:1.6rem">${g.icon}</span><div class="grow"><b>${g.title}</b><div class="small muted">${g.desc}</div>${s ? `<div class="tiny mt1 ok-t">${s.ok} ✓ / ${s.answered}</div>` : ''}</div></div></a>`;
  }
  App.course = { genCard };

  /* ---------- Page d'une leçon ---------- */
  R.add('/cours/:mod/:idx', (p) => {
    const m = App.content.mod(p.mod);
    if (!m) return R.go('/cours');
    const i = +p.idx;
    const l = m.lessons[i];
    if (!l) return R.go('/cours/' + m.id);
    App.layout.setTitle(l.title);
    const prev = m.lessons[i - 1], next = m.lessons[i + 1];
    const isDone = App.progress.lessonDone(l.id);
    const note = App.store.state.notes[l.id] || '';
    const v = App.ui.mount(`
      ${App.ui.crumbs([['Cours', '#/cours'], [m.short || m.title, '#/cours/' + m.id], ['Leçon ' + (i + 1)]])}
      <div style="--mc:${m.color}">
        <div class="row between" style="align-items:flex-start">
          <div class="grow"><div class="tiny" style="font-weight:800;color:${m.color};text-transform:uppercase;letter-spacing:.06em">${m.icon} ${m.label} · leçon ${i + 1}/${m.lessons.length} · ${l.min || 5} min</div><h1 class="mt1">${l.title}</h1></div>
          ${isDone ? '<span class="chip ok">✓ comprise</span>' : ''}
        </div>
        ${App.ui.bar((i + 1) / m.lessons.length)}
        ${l.essentiel ? `<div class="essentiel mt2"><div class="tag">⚡ L'essentiel en 30 secondes</div>${l.essentiel}</div>` : '<div class="mt2"></div>'}
        <article class="prose">${l.html}</article>
        ${l.check.length ? `<h2 class="mt3">🧩 Vérifie ta compréhension</h2><p class="muted small">Réponds sans relire : c'est l'effort de rappel qui fixe la mémoire. Les erreurs vont dans ton carnet.</p><div class="stack" id="checks"></div>` : ''}
        <details class="card mt3"><summary style="cursor:pointer;font-weight:700">📝 Mes notes sur cette leçon</summary><textarea class="input mt1" rows="3" id="note" placeholder="Reformule avec tes mots (technique Feynman) : si tu sais l'expliquer simplement, tu l'as compris.">${U.esc(note)}</textarea></details>
        <div class="row mt3">
          ${prev ? `<a class="btn" href="#/cours/${m.id}/${i - 1}">◀ ${U.esc(prev.title)}</a>` : `<a class="btn" href="#/cours/${m.id}">◀ Sommaire</a>`}
          <span class="grow"></span>
          <button class="btn ${isDone ? 'ghost' : 'ok'}" id="markDone">${isDone ? '✓ Comprise' : '✓ J\'ai compris'}</button>
          ${next ? `<a class="btn primary" href="#/cours/${m.id}/${i + 1}" id="nextL">${U.esc(next.title)} ▶</a>` : `<a class="btn primary" href="#/quiz/${m.id}">QCM de la séance ▶</a>`}
        </div>
      </div>`);
    // questions de vérification
    const host = v.querySelector('#checks');
    let answered = 0;
    if (host) {
      l.check.forEach((q) => {
        const api = App.qview.create(q, {
          mode: 'practice',
          onAnswer: (res) => {
            answered++;
            App.progress.record(q, res.ok);
            App.game.addXP(App.quiz.xpFor(q, res, 0), api.el.querySelector('.q-text'));
            App.fx.sound(res.ok ? 'ok' : 'ko');
            if (answered === l.check.length) complete();
          },
          onNext: () => {
            const nx = api.el.nextElementSibling;
            if (nx) nx.scrollIntoView({ behavior: 'smooth', block: 'center' });
            else { const b = document.getElementById('nextL') || document.getElementById('markDone'); if (b) b.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
          }
        });
        host.appendChild(api.el);
      });
    }
    function complete() {
      if (App.progress.markLesson(l.id)) {
        App.game.addXP(25, document.getElementById('markDone'));
        App.ui.toast('📖', '<b>Leçon terminée !</b><div class="muted small">+25 XP</div>');
        App.fx.sound('level');
        const b = document.getElementById('markDone');
        if (b) { b.className = 'btn ghost'; b.textContent = '✓ Comprise'; }
      }
    }
    v.querySelector('#markDone').addEventListener('click', complete);
    v.querySelector('#note').addEventListener('input', U.debounce((e) => { App.store.state.notes[l.id] = e.target.value; App.store.save(); }, 400));
    App.ui.keys({ ArrowRight: () => next && R.go(`/cours/${m.id}/${i + 1}`), ArrowLeft: () => prev && R.go(`/cours/${m.id}/${i - 1}`) });
  });
})();

</script>
  <script>
/* js/controllers/cards.js */
/* Contrôleur : cartes mémoire avec répétition espacée (retourner, s'auto-évaluer). */
(function () {
  'use strict';
  const App = window.App;
  const U = App.util;
  const R = App.router;

  R.add('/cartes', (p, query) => {
    App.layout.setTitle('Cartes mémoire');
    const mods = App.content.modules.filter((m) => m.cards.length);
    if (query.go == null) {
      const all = App.srs.counts();
      App.ui.mount(`
        <div class="page-head"><h1>🃏 Cartes mémoire</h1><div class="sub">Répétition espacée : une carte revient juste avant que tu l'oublies. Sois honnête dans ton auto-évaluation : c'est elle qui règle le calendrier.</div></div>
        <div class="card pad-lg">
          <div class="row nowrap">
            ${App.ui.ring(all.total ? all.mastered / all.total : 0, 84, 8, 'var(--ok)', `${all.mastered}<small>maîtrisées</small>`)}
            <div class="grow">
              <div class="row"><span class="chip ko">${all.due} à revoir</span><span class="chip pri">${all.fresh} nouvelles</span><span class="chip">${all.total} au total</span></div>
              <p class="small muted mt1 mb1">Prochaine échéance : ${App.srs.nextDueLabel() || '—'}. Chaque session = les cartes dues + ${App.store.state.settings.newCardsPerSession} nouvelles.</p>
              <a class="btn primary lg" href="#/cartes?go=1">▶ Lancer la session</a>
            </div>
          </div>
        </div>
        ${App.md.tip('Pour chaque carte : <b>essaie de répondre à voix haute avant de la retourner</b>. Raccourcis : <kbd>Espace</kbd> retourner · <kbd>1</kbd> À revoir · <kbd>2</kbd> Difficile · <kbd>3</kbd> Bien · <kbd>4</kbd> Facile.')}
        <h2 class="mt3">Par module</h2>
        <div class="grid auto">${mods.map((m) => {
          const c = App.srs.counts(m.id);
          return `<a class="card hover" style="color:inherit;text-decoration:none;border-left:5px solid ${m.color}" href="#/cartes?go=1&mod=${m.id}"><div class="row nowrap"><span style="font-size:1.5rem">${m.icon}</span><div class="grow"><b>${m.short || m.title}</b><div class="small muted">${c.total} cartes · ${c.due} à revoir · ${c.fresh} nouvelles</div>${App.ui.bar(c.total ? c.mastered / c.total : 0, 'ok')}</div></div></a>`;
        }).join('')}</div>`);
      return;
    }
    session(query.mod || null);
  });

  function session(modId) {
    const queue = App.srs.session({ mod: modId });
    const m = modId ? App.content.mod(modId) : null;
    const title = m ? `${m.icon} Cartes — ${m.short || m.title}` : '🃏 Session de cartes';
    let i = 0, flipped = false, reviewed = 0, xp = 0;
    const tally = [0, 0, 0, 0];
    if (!queue.length) {
      App.ui.mount(`${App.ui.crumbs([['Cartes', '#/cartes'], ['Session']])}<div class="card empty"><div class="big">🎉</div><h2>Rien à revoir pour l'instant</h2><p>Toutes les cartes de ce paquet sont à jour. Prochaine échéance : ${App.srs.nextDueLabel(modId) || '—'}.</p><a class="btn primary" href="#/entrainement">S'entraîner autrement</a></div>`);
      return;
    }
    const v = App.ui.mount(`
      ${App.ui.crumbs([['Cartes', '#/cartes'], ['Session']])}
      <div class="page-head"><h1>${title}</h1></div>
      <div class="quiz-top"><span class="small muted nowrap" id="cCount"></span>${App.ui.bar(0)}<button class="btn sm ghost" id="cEnd">Terminer</button></div>
      <div id="cHost"></div>`);
    const host = v.querySelector('#cHost');
    const bar = v.querySelector('.bar > i');
    v.querySelector('#cEnd').addEventListener('click', end);

    function show() {
      if (i >= queue.length) return end();
      const c = queue[i];
      const cm = App.content.mod(c.mod);
      const st = App.srs.state(c.id);
      flipped = false;
      v.querySelector('#cCount').textContent = `${i + 1} / ${queue.length}`;
      bar.style.width = Math.round((i / queue.length) * 100) + '%';
      host.innerHTML = `
        <div class="flip-wrap" style="--mc:${cm ? cm.color : 'var(--primary)'}">
          <div class="flip" id="flip">
            <div class="face front"><span class="tag">${cm ? cm.icon + ' ' + (cm.short || cm.title) : ''} ${st ? '' : '· nouvelle'}</span><div class="fc-text">${c.front}</div><div class="hint">Réponds dans ta tête, puis touche la carte (Espace)</div></div>
            <div class="face back"><span class="tag">Réponse</span><div class="fc-text prose">${c.back}</div></div>
          </div>
        </div>
        <div id="rateBox" class="mt2"><button class="btn primary lg block" id="flipBtn">Retourner la carte <span class="k">Espace</span></button></div>`;
      const flip = host.querySelector('#flip');
      // hauteur adaptée au contenu le plus long
      requestAnimationFrame(() => {
        const faces = U.$$('.face', flip);
        const h = Math.max(290, ...faces.map((f) => f.scrollHeight + 10));
        flip.style.minHeight = Math.min(h, 620) + 'px';
      });
      flip.addEventListener('click', doFlip);
      host.querySelector('#flipBtn').addEventListener('click', doFlip);
    }

    function doFlip() {
      const flip = host.querySelector('#flip');
      if (!flip) return;
      if (flipped) { flip.classList.toggle('on'); return; }
      flipped = true;
      flip.classList.add('on');
      App.fx.sound('flip');
      const c = queue[i];
      const st = App.srs.state(c.id);
      const lbl = (k) => {
        if (k === 0) return '< 1 min';
        const sim = Object.assign({ box: 0 }, st || {});
        let box = sim.box;
        if (k === 1) box = Math.max(1, box); else if (k === 2) box = Math.min(6, box === 0 ? 2 : box + 1); else box = Math.min(6, box === 0 ? 3 : box + 2);
        const ms = App.srs.INTERVALS[box] * (k === 1 ? 0.5 : 1);
        return ms < 3600000 ? Math.round(ms / 60000) + ' min' : ms < 86400000 ? Math.round(ms / 3600000) + ' h' : Math.round(ms / 86400000) + ' j';
      };
      host.querySelector('#rateBox').innerHTML = `<div class="rate">
        <button class="btn again" data-r="0">À revoir<small>${lbl(0)} · 1</small></button>
        <button class="btn hard" data-r="1">Difficile<small>${lbl(1)} · 2</small></button>
        <button class="btn good" data-r="2">Bien<small>${lbl(2)} · 3</small></button>
        <button class="btn easy" data-r="3">Facile<small>${lbl(3)} · 4</small></button></div>`;
      U.$$('[data-r]', host).forEach((b) => b.addEventListener('click', () => rate(+b.dataset.r)));
    }

    function rate(r) {
      if (!flipped) return;
      const c = queue[i];
      App.srs.rate(c.id, r);
      tally[r]++;
      reviewed++;
      const t = App.store.today();
      t.cards = (t.cards || 0) + 1;
      const tot = App.store.count('cardsReviewed');
      if (tot >= 100) App.game.award('cards100');
      if (tot >= 500) App.game.award('cards500');
      const gain = [1, 2, 3, 3][r];
      xp += gain;
      App.game.addXP(gain, false);
      if (r === 0) queue.push(c); // revient en fin de session
      i++;
      show();
    }

    function end() {
      App.router.onLeave(() => {});
      bar.style.width = '100%';
      App.fx.sound('end');
      if (reviewed >= 10) App.fx.confetti(0.6);
      host.innerHTML = `<div class="card pad-lg center"><div class="big-emoji" style="font-size:3.4rem">🧠</div><h2 class="mt1">${reviewed} carte(s) révisée(s)</h2>
        <div class="row mt1" style="justify-content:center"><span class="chip ko">À revoir ${tally[0]}</span><span class="chip warn">Difficile ${tally[1]}</span><span class="chip ok">Bien ${tally[2]}</span><span class="chip pri">Facile ${tally[3]}</span></div>
        <p class="muted mt2">+${xp} XP · prochaine échéance ${App.srs.nextDueLabel(modId) || '—'}</p>
        <div class="row mt2" style="justify-content:center"><a class="btn primary" href="#/cartes">Autre paquet</a><a class="btn" href="#/entrainement">S'entraîner</a></div></div>`;
      v.querySelector('#cCount').textContent = 'Terminé';
      App.store.save();
    }

    App.ui.keys({
      ' ': (e) => { e.preventDefault(); doFlip(); },
      Enter: (e) => { if (!flipped) { e.preventDefault(); doFlip(); } },
      1: () => rate(0), 2: () => rate(1), 3: () => rate(2), 4: () => rate(3)
    });
    show();
  }
})();

</script>

    if (!m) return R.go('/entrainement');
    const n = +(query.n || 0) || m.qcm.length;
    // priorité aux questions jamais vues / ratées
    const st = App.store.state.qstats;
    const pool = U.shuffle(m.qcm).sort((a, b) => score(a) - score(b));
    function score(q) { const s = st[q.id]; return !s ? 0 : s.streak >= 2 ? 3 : s.ok / s.seen < 0.6 ? 1 : 2; }
    App.runner.start({
      title: `${m.icon} QCM — ${m.short || m.title}`,
      crumbs: [['Cours', '#/cours'], [m.short || m.title, '#/cours/' + m.id], ['QCM']],
      questions: pool.slice(0, n),
      backHref: '#/cours/' + m.id + '?tab=pratique',
      retry: () => R.resolve()
    });
  });

  function mix() {
    const st = App.store.state;
    const today = U.dayKey();
    const seen = App.content.modules.filter((m) => !m.day || m.day <= today || (st.modStats[m.id] && st.modStats[m.id].answered));
    const errs = App.progress.errors().slice(0, 5).map((e) => e.q);
    const weak = seen.slice().sort((a, b) => App.progress.mastery(a.id) - App.progress.mastery(b.id)).slice(0, 3);
    const qs = [];
    const add = (q) => { if (q && !qs.find((x) => x.id === q.id)) qs.push(q); };
    errs.forEach(add);
    weak.forEach((m) => U.shuffle(m.qcm).slice(0, 3).forEach(add));
    U.shuffle(seen.flatMap((m) => m.qcm)).slice(0, 8).forEach(add);
    const gens = App.gen.list.filter((g) => seen.find((m) => m.id === g.mod));
    for (let i = 0; i < 3 && gens.length; i++) add(App.gen.make(U.pick(gens).id, U.R.int(1, 2)));
    App.runner.start({
      title: '🎲 Mélange intelligent',
      sub: 'Tes erreurs, tes points faibles et des calculs générés, mélangés.',
      crumbs: [['Entraînement', '#/entrainement'], ['Mélange']],
      questions: U.shuffle(qs).slice(0, 15),
      retry: () => R.resolve()
    });
  }

  /* ---------- Pré-test ---------- */
  R.add('/pretest/:mod', (p) => {
    const m = App.content.mod(p.mod);
    if (!m || !m.pretest.length) return R.go('/cours');
    App.runner.start({
      title: `🧪 Pré-test — ${m.short || m.title}`,
      sub: 'Réponds au mieux AVANT de lire le cours. Se tromper ici est normal et utile.',
      crumbs: [['Cours', '#/cours'], [m.short || m.title, '#/cours/' + m.id], ['Pré-test']],
      questions: m.pretest,
      noErrorLog: true,
      backHref: '#/cours/' + m.id,
      onFinish: (s) => { App.store.state.pretest[m.id] = { score: s.ok, total: s.n, at: Date.now() }; App.store.save(); }
    });
  });

  /* ---------- Carnet d'erreurs ---------- */
  R.add('/erreurs', (p, query) => {
    App.layout.setTitle('Carnet d\'erreurs');
    if (query.go != null) return replay(query.mod || null);
    const list = App.progress.errors();
    const byMod = {};
    list.forEach((e) => (byMod[e.mod] = (byMod[e.mod] || 0) + 1));
    App.ui.mount(`
      <div class="page-head"><h1>🩹 Carnet d'erreurs</h1><div class="sub">Rempli automatiquement. Une erreur disparaît quand tu y réponds juste <b>2 fois d'affilée</b> (+15 XP à chaque erreur vaincue). Erreurs vaincues : <b class="ok-t">${App.store.state.errorsBeaten || 0}</b>.</div></div>
      ${list.length ? `
        <div class="row"><a class="btn primary lg" href="#/erreurs?go=1">🔁 Rejouer mes ${Math.min(list.length, 20)} erreurs</a>
        ${Object.entries(byMod).map(([mid, n]) => { const m = App.content.mod(mid); return m ? `<a class="btn sm" href="#/erreurs?go=1&mod=${mid}">${m.icon} ${m.short} (${n})</a>` : ''; }).join('')}</div>
        <div class="stack mt2">${list.map((e) => { const m = App.content.mod(e.mod); return `<div class="card"><div class="row between"><span class="chip" style="color:${m ? m.color : ''}">${m ? m.icon + ' ' + m.short : ''}</span><span class="tiny muted">ratée ${e.wrong}× · ${U.ago(e.at)}${e.ok ? ' · 1 réussite' : ''}</span></div><div class="mt1">${e.q.q}</div></div>`; }).join('')}</div>
        <div class="mt2"><button class="btn sm ghost" id="clearErr">Vider le carnet</button></div>`
        : `<div class="card empty"><div class="big">✨</div><h2>Carnet vide</h2><p>Aucune erreur en attente. Lance un QCM ou un défi : tes erreurs apparaîtront ici pour être retravaillées.</p><a class="btn primary" href="#/quiz/mix">🎲 Mélange intelligent</a></div>`}`);
    const cb = document.getElementById('clearErr');
    if (cb) cb.addEventListener('click', () => App.ui.confirm('<h3>Vider le carnet ?</h3><p>Les erreurs enregistrées seront supprimées.</p>', 'Vider', () => { App.store.state.errors = {}; App.store.save(); R.resolve(); }, true));
  });

  function replay(mod) {
    const list = App.progress.errors(mod).slice(0, 20).map((e) => {
      const q = JSON.parse(JSON.stringify(e.q));
      delete q._order; delete q._rorder;
      return q;
    });
    const t = App.store.today();
    t.errReplay = (t.errReplay || 0) + 1;
    App.runner.start({
      title: '🔁 Rejouer mes erreurs',
      sub: 'Deux bonnes réponses d\'affilée sur une erreur = elle est vaincue.',
      crumbs: [['Carnet d\'erreurs', '#/erreurs'], ['Rejouer']],
      questions: U.shuffle(list),
      backHref: '#/erreurs',
      retry: () => R.resolve()
    });
  }
})();

</script>
  <script>
/* js/controllers/exercises.js */
/* Contrôleur : exercices type concours (énoncé, réponses partiellement auto-corrigées, corrigé détaillé, auto-évaluation au barème). */
(function () {
  'use strict';
  const App = window.App;
  const U = App.util;
  const R = App.router;

  /* Rend un bloc « partie » réutilisé par les exercices et le sujet blanc.
     onGrade(points) est appelé à chaque auto-évaluation. */
  function partBlock(part, k, onGrade, opts) {
    opts = opts || {};
    const el = U.el(`<div class="part">
      <div class="row between nowrap" style="align-items:flex-start"><div class="grow prose">${part.q}</div><span class="pts nowrap">${U.fmtNum(part.pts)} pt${part.pts > 1 ? 's' : ''}</span></div>
      ${part.fields ? `<div class="fields mt1">${part.fields.map((f, i) => `<div class="field" style="${f.wide ? 'grid-column:1/-1' : ''}"><label class="lbl">${f.label || 'Réponse'}</label>${f.kind === 'select' ? `<select class="input" data-i="${i}"><option value="">—</option>${f.opts.map((o, j) => `<option value="${j}">${o}</option>`).join('')}</select>` : `<input class="input ${/ip|cidr|mask|v6|num|bin|hex/.test(f.kind || '') ? 'mono' : ''}" data-i="${i}" autocomplete="off" spellcheck="false" placeholder="${U.esc(f.ph || '')}">`}<div class="exp"></div></div>`).join('')}</div>` : `<textarea class="input mt1" rows="${opts.rows || 3}" placeholder="Rédige ta réponse ici (ou sur papier, comme le jour J)…"></textarea>`}
      <div class="row mt1">${part.fields ? '<button class="btn sm soft" data-check>Vérifier</button>' : ''}<button class="btn sm" data-corr>Voir le corrigé</button><span class="grow"></span><span class="small muted" data-gotlbl></span></div>
      <div data-corrbox></div>
    </div>`);
    let auto = null;
    const box = el.querySelector('[data-corrbox]');
    if (part.fields) {
      el.querySelector('[data-check]').addEventListener('click', () => {
        const inputs = U.$$('[data-i]', el);
        let n = 0;
        inputs.forEach((inp, i) => {
          const f = part.fields[i];
          const ok = App.quiz.checkField(f, inp.value);
          if (ok) n++;
          inp.classList.remove('ok', 'ko');
          inp.classList.add(ok ? 'ok' : 'ko');
          const exp = inp.parentElement.querySelector('.exp');
          exp.className = 'exp ' + (ok ? 'ok' : 'ko');
          exp.textContent = ok ? '✓' : '→ ' + App.quiz.expected(f);
        });
        auto = Math.round((n / inputs.length) * part.pts * 2) / 2;
        App.fx.sound(n === inputs.length ? 'ok' : 'ko');
        showCorr();
        grade(auto, true);
      });
    }
    el.querySelector('[data-corr]').addEventListener('click', showCorr);
    function showCorr() {
      if (box.innerHTML) return;
      const half = part.pts / 2;
      box.innerHTML = `<div class="corr prose">${part.corr}</div>
        <div class="grade-row"><span class="small muted">Ma note :</span>
          <button class="btn sm ko" data-g="0">0</button>
          ${part.pts >= 1 ? `<button class="btn sm" data-g="${half}">${U.fmtNum(half)}</button>` : ''}
          <button class="btn sm ok" data-g="${part.pts}">${U.fmtNum(part.pts)} ✓</button>
          <span class="small muted">/ ${U.fmtNum(part.pts)}</span></div>`;
      App.ui.hydrate(box);
      U.$$('[data-g]', box).forEach((b) => b.addEventListener('click', () => grade(+b.dataset.g)));
      if (auto != null) grade(auto, true);
    }
    function grade(v, silent) {
      U.$$('[data-g]', box).forEach((b) => b.classList.toggle('on', +b.dataset.g === v));
      el.querySelector('[data-gotlbl]').innerHTML = `<b class="${v >= part.pts ? 'ok-t' : v > 0 ? 'warn-t' : 'ko-t'}">${U.fmtNum(v)} / ${U.fmtNum(part.pts)}</b>`;
      onGrade(k, v);
      if (!silent) App.fx.sound(v >= part.pts ? 'ok' : 'tick');
    }
    return el;
  }
  App.exo = { partBlock };

  R.add('/exo/:id', (p) => {
    const e = App.content.exercises[p.id];
    if (!e) return R.go('/entrainement');
    const m = App.content.mod(e.mod);
    App.layout.setTitle(e.title);
    const grades = {};
    const prev = App.progress.exerciseScore(e.id);
    const v = App.ui.mount(`
      ${App.ui.crumbs([['Cours', '#/cours'], [m.short || m.title, '#/cours/' + m.id + '?tab=pratique'], ['Exercice']])}
      <div class="page-head"><div class="tiny" style="font-weight:800;color:${m.color};text-transform:uppercase;letter-spacing:.06em">${m.icon} ${m.label} · ${e.min || 10} min · ${e.points} points${e.src ? ' · ' + e.src : ''}</div><h1 class="mt1">✍️ ${e.title}</h1></div>
      <div class="card"><div class="row between"><span class="small muted">Conditions concours : papier, crayon, pas de calculatrice. Lance le chrono puis compare au corrigé.</span><span class="row"><span class="timer" id="tm">${U.fmtDuration((e.min || 10) * 60)}</span><button class="btn sm" id="tmGo">⏱️ Démarrer</button></span></div>
        ${e.statement ? `<div class="prose mt2">${e.statement}</div>` : ''}</div>
      <div class="card mt2" id="parts"></div>
      <div class="card mt2 center" id="total"></div>`);
    const host = v.querySelector('#parts');
    e.parts.forEach((part, k) => host.appendChild(partBlock(part, k, (kk, val) => { grades[kk] = val; total(); })));
    function total() {
      const sc = U.sum(Object.values(grades));
      const all = Object.keys(grades).length === e.parts.length;
      v.querySelector('#total').innerHTML = `<div class="small muted">Total ${all ? '' : '(provisoire)'}</div><div class="bignum ${sc / e.points >= 0.7 ? 'ok-t' : sc / e.points >= 0.4 ? 'warn-t' : 'ko-t'}">${U.fmtNum(sc)} / ${e.points}</div>
        ${prev ? `<div class="small muted">Meilleur score précédent : ${U.fmtNum(prev.best || prev.score)} / ${prev.max}</div>` : ''}
        <div class="row mt2" style="justify-content:center"><button class="btn primary" id="save" ${all ? '' : 'disabled'}>💾 Enregistrer mon score</button><a class="btn" href="#/cours/${m.id}?tab=pratique">Retour</a></div>`;
      const sb = v.querySelector('#save');
      sb.addEventListener('click', () => {
        App.progress.saveExercise(e.id, sc, e.points);
        App.game.addXP(Math.round(sc * 5) + 10, sb);
        App.ui.toast('✍️', `<b>Score enregistré : ${U.fmtNum(sc)}/${e.points}</b>`);
        if (sc / e.points >= 0.8) App.fx.confetti(0.6);
        sb.disabled = true;
        sb.textContent = '✓ Enregistré';
      });
    }
    total();
    // chronomètre
    let left = (e.min || 10) * 60, tid = null;
    v.querySelector('#tmGo').addEventListener('click', (ev) => {
      if (tid) { clearInterval(tid); tid = null; ev.target.textContent = '▶ Reprendre'; return; }
      ev.target.textContent = '⏸ Pause';
      tid = setInterval(() => {
        left--;
        const t = v.querySelector('#tm');
        if (!t) return clearInterval(tid);
        t.textContent = (left < 0 ? '+' : '') + U.fmtDuration(Math.abs(left));
        t.classList.toggle('low', left <= 60);
        if (left === 0) { App.fx.sound('end'); App.ui.toast('⏰', 'Temps écoulé ! Termine ta phrase et passe au corrigé.'); }
      }, 1000);
    });
    App.router.onLeave(() => clearInterval(tid));
  });
})();

</script>
  <script>
/* js/controllers/exam.js */
/* Contrôleur : examens blancs — sujet blanc (auto-évalué au barème) et examen express (auto-corrigé), notes E1/E2. */
(function () {
  'use strict';
  const App = window.App;
  const U = App.util;
  const R = App.router;

  const E1_MODS = ['s7', 's8'];
  const avgOf = (e1, e2) => (2 * e1 + 3 * e2) / 5;

  function verdict(e1, e2) {
    const avg = avgOf(e1, e2);
    const elim = e1 <= 5 || e2 <= 5;
    return { avg, elim, html: `
      <div class="grid c3 mt2">
        <div class="card center"><div class="small muted">Épreuve 1 (coef. 2)</div><div class="bignum ${e1 <= 5 ? 'ko-t' : e1 >= 10 ? 'ok-t' : 'warn-t'}">${U.fmtNum(e1, 1)}</div><div class="tiny muted">/ 20 — systèmes</div></div>
        <div class="card center"><div class="small muted">Épreuve 2 (coef. 3)</div><div class="bignum ${e2 <= 5 ? 'ko-t' : e2 >= 10 ? 'ok-t' : 'warn-t'}">${U.fmtNum(e2, 1)}</div><div class="tiny muted">/ 20 — réseaux & télécoms</div></div>
        <div class="card center" style="border:2px solid var(--primary)"><div class="small muted">Moyenne (2×E1 + 3×E2) / 5</div><div class="bignum pri-t">${U.fmtNum(avg, 2)}</div><div class="tiny muted">/ 20</div></div>
      </div>
      ${elim ? App.md.trap(`Une note ≤ 5 est <b>éliminatoire</b>${e1 <= 5 ? ' (Épreuve 1)' : ''}${e2 <= 5 ? ' (Épreuve 2)' : ''}. Ce soir : relis uniquement les « 5 phrases » des séances concernées et refais leurs QCM. Ne commence rien de nouveau.`, 'Alerte note éliminatoire') :
        avg >= 14 ? App.md.key('Excellent niveau : garde le rythme, relis la fiche dernière heure et dors bien.', '🏆 Très bon résultat') :
        avg >= 10 ? App.md.reflex('Au-dessus de la moyenne. Repère dans la correction les questions perdues et refais-les demain matin en 10 minutes.', '✅ Objectif atteint') :
        App.md.tip('Sous la moyenne : concentre-toi sur les points « faciles » (droits Linux, cron, RAID, AGDLP, LSDOU, ports, sous-réseaux) — ce sont les plus rentables.', '💪 Plan de remontée')}` };
  }

  function saveResult(kind, e1, e2, extra) {
    const st = App.store.state;
    const avg = avgOf(e1, e2);
    st.exams.push(Object.assign({ at: Date.now(), kind, e1: Math.round(e1 * 10) / 10, e2: Math.round(e2 * 10) / 10, avg: Math.round(avg * 100) / 100 }, extra || {}));
    App.game.award('exam');
    if (avg >= 10 && e1 > 5 && e2 > 5) App.game.award('exam10');
    if (avg >= 14 && e1 > 5 && e2 > 5) App.game.award('exam14');
    App.game.addXP(100 + Math.round(avg * 10), false);
    App.store.save();
  }

  /* ---------- Hub ---------- */
  R.add('/examen', () => {
    App.layout.setTitle('Examen blanc');
    const hist = App.store.state.exams.slice().reverse();
    const blanc = App.content.extras.examBlanc;
    App.ui.mount(`
      <div class="page-head"><h1>📝 Examen blanc</h1><div class="sub">Mets-toi en conditions réelles : téléphone en silencieux, pas de notes, pas de calculatrice. Note finale = (2 × E1 + 3 × E2) / 5, avec <b>note ≤ 5 éliminatoire</b>.</div></div>
      <div class="grid c2">
        ${blanc ? `<a class="card hover" href="#/examen/blanc" style="color:inherit;text-decoration:none;border-top:4px solid var(--primary)"><h3>📄 ${blanc.title}</h3><p class="small muted">Sujet complet de la séance 9 : étude de cas Agadez — réseaux, télécoms, Linux, Windows, sauvegardes. ${blanc.minutes} min. Tu rédiges, puis tu t'auto-évalues avec le barème officiel.</p><span class="chip pri">${blanc.minutes} min · 40 pts</span></a>` : ''}
        <a class="card hover" href="#/examen/express" style="color:inherit;text-decoration:none;border-top:4px solid var(--accent)"><h3>⚡ Examen express auto-corrigé</h3><p class="small muted">30 questions tirées au sort (QCM + calculs générés) : 18 pour l'Épreuve 2, 12 pour l'Épreuve 1. Corrigé automatiquement, toujours différent.</p><span class="chip acc">35 min · 30 questions</span></a>
        <a class="card hover" href="#/examen/express?part=e2" style="color:inherit;text-decoration:none"><h3>🌐 Mini-épreuve 2 (réseaux)</h3><p class="small muted mb0">20 questions · 25 min</p></a>
        <a class="card hover" href="#/examen/express?part=e1" style="color:inherit;text-decoration:none"><h3>🖥️ Mini-épreuve 1 (systèmes)</h3><p class="small muted mb0">15 questions · 20 min — sécurise la note éliminatoire.</p></a>
      </div>
      ${App.content.extras.reflexes ? `<div class="card mt2"><h3>🧭 Le jour J : les réflexes</h3><ol class="steps">${App.content.extras.reflexes.map((r) => `<li>${r}</li>`).join('')}</ol></div>` : ''}
      <h2 class="mt3">📈 Historique</h2>
      ${hist.length ? App.md.table(['Date', 'Type', 'E1', 'E2', 'Moyenne'], hist.map((h) => [new Date(h.at).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }), h.kind, `<span class="${h.e1 <= 5 ? 'ko-t' : ''}">${U.fmtNum(h.e1, 1)}</span>`, `<span class="${h.e2 <= 5 ? 'ko-t' : ''}">${U.fmtNum(h.e2, 1)}</span>`, `<b>${U.fmtNum(h.avg, 2)}</b>`])) : '<p class="muted">Aucun examen passé pour l\'instant.</p>'}`);
  });

  /* ---------- Examen express ---------- */
  R.add('/examen/express', (p, query) => {
    const part = query.part || 'all';
    const conf = part === 'e1' ? { n1: 15, n2: 0, min: 20, label: 'Mini-épreuve 1' } : part === 'e2' ? { n1: 0, n2: 20, min: 25, label: 'Mini-épreuve 2' } : { n1: 12, n2: 18, min: 35, label: 'Examen express' };
    const mods = App.content.modules;
    const pick = (isE1, n) => {
      const ms = mods.filter((m) => (E1_MODS.includes(m.id)) === isE1);
      const qcm = U.shuffle(ms.flatMap((m) => m.qcm));
      const gens = App.gen.list.filter((g) => ms.find((m) => m.id === g.mod));
      const out = [];
      const nGen = Math.round(n * 0.35);
      for (let i = 0; i < nGen && gens.length; i++) out.push(App.gen.make(U.pick(gens).id, U.R.int(1, 3)));
      return out.concat(qcm.slice(0, n - out.length)).map((q) => Object.assign({}, q, { _e1: isE1 }));
    };
    const qs = U.shuffle(pick(true, conf.n1)).concat(U.shuffle(pick(false, conf.n2)));
    if (!qs.length) return R.go('/examen');
    App.layout.setTitle(conf.label);
    const resp = qs.map(() => null);
    let cur = 0, left = conf.min * 60, tid = null, finished = false;
    const v = App.ui.mount(`
      ${App.ui.crumbs([['Examen', '#/examen'], [conf.label]])}
      <div class="page-head row between"><h1 class="mb0">⚡ ${conf.label}</h1><span class="timer" id="tm"></span></div>
      <div class="card"><div class="small muted mb1">Clique sur un numéro pour naviguer. Aucune correction avant la fin.</div><div class="row" id="pal" style="gap:.35rem"></div></div>
      <div id="qh" class="mt2"></div>
      <div class="row mt2"><button class="btn" id="pv">◀ Précédente</button><span class="grow"></span><button class="btn" id="nx">Suivante ▶</button><button class="btn accent" id="fin">Rendre la copie</button></div>`);
    const pal = v.querySelector('#pal');
    function drawPal() {
      pal.innerHTML = qs.map((q, i) => `<button class="btn sm ${i === cur ? 'primary' : resp[i] != null && (!Array.isArray(resp[i]) || resp[i].some((x) => x != null && String(x).trim() !== '')) ? 'soft' : ''}" data-i="${i}" style="min-width:2.4rem;padding:.3rem .4rem">${i + 1}${q._e1 ? '<sup style="font-size:.6em">E1</sup>' : ''}</button>`).join('');
      U.$$('[data-i]', pal).forEach((b) => b.addEventListener('click', () => { cur = +b.dataset.i; show(); }));
    }
    function show() {
      const q = qs[cur];
      const api = App.qview.create(q, { mode: 'exam', initial: resp[cur], onChange: (r) => { resp[cur] = r; drawPal(); } });
      const h = v.querySelector('#qh');
      h.innerHTML = `<div class="small muted mb1">Question ${cur + 1} / ${qs.length} · ${q._e1 ? 'Épreuve 1' : 'Épreuve 2'}</div>`;
      h.appendChild(api.el);
      api.focus();
      drawPal();
      v.querySelector('#pv').disabled = cur === 0;
      v.querySelector('#nx').disabled = cur === qs.length - 1;
    }
    v.querySelector('#pv').addEventListener('click', () => { if (cur > 0) { cur--; show(); } });
    v.querySelector('#nx').addEventListener('click', () => { if (cur < qs.length - 1) { cur++; show(); } });
    v.querySelector('#fin').addEventListener('click', () => {
      const empty = resp.filter((r) => r == null).length;
      App.ui.confirm(`<h3>Rendre la copie ?</h3><p>${empty ? `<b>${empty}</b> question(s) sans réponse.` : 'Toutes les questions ont une réponse.'} Il reste ${U.fmtDuration(left)}.</p>`, 'Rendre', finish);
    });
    function tick() {
      const t = v.querySelector('#tm');
      if (!t) return;
      t.textContent = '⏱️ ' + U.fmtDuration(left);
      t.classList.toggle('low', left <= 120);
      if (left <= 0) { finish(); return; }
      left--;
    }
    tick();
    tid = setInterval(tick, 1000);
    App.router.onLeave(() => clearInterval(tid));
    show();

    function finish() {
      if (finished) return;
      finished = true;
      clearInterval(tid);
      const res = qs.map((q, i) => (resp[i] == null ? { ok: false, score: 0 } : App.quiz.check(q, resp[i])));
      const part1 = qs.map((q, i) => ({ q, r: res[i] })).filter((x) => x.q._e1);
      const part2 = qs.map((q, i) => ({ q, r: res[i] })).filter((x) => !x.q._e1);
      const sc = (arr) => (arr.length ? (U.sum(arr.map((x) => x.r.score)) / arr.length) * 20 : null);
      let e1 = sc(part1), e2 = sc(part2);
      qs.forEach((q, i) => App.progress.record(q, res[i].ok, { noErrorLog: res[i].score > 0.99 }));
      const okN = res.filter((r) => r.ok).length;
      if (e1 != null && e2 != null) saveResult(conf.label, e1, e2, { n: qs.length, ok: okN });
      else App.game.addXP(60 + okN * 3, false);
      App.fx.sound('end');
      const vd = e1 != null && e2 != null ? verdict(e1, e2).html : `<div class="card center mt2"><div class="bignum pri-t">${U.fmtNum((e1 != null ? e1 : e2), 1)} / 20</div><div class="muted">${e1 != null ? 'Épreuve 1' : 'Épreuve 2'} (${okN}/${qs.length} justes)</div></div>`;
      if ((e1 == null || e1 > 10) && (e2 == null || e2 > 10)) App.fx.confetti(0.8);
      v.innerHTML = `${App.ui.crumbs([['Examen', '#/examen'], ['Résultats']])}
        <div class="page-head"><h1>📊 Résultats — ${conf.label}</h1><div class="sub">${okN} / ${qs.length} réponses justes en ${U.fmtDuration(conf.min * 60 - left)}.</div></div>
        ${vd}
        <h2 class="mt3">Correction détaillée</h2>
        <div class="stack">${qs.map((q, i) => `<div class="card"><div class="row between"><span class="chip ${res[i].ok ? 'ok' : res[i].score > 0 ? 'warn' : 'ko'}">${res[i].ok ? '✓' : res[i].score > 0 ? '½' : '✗'} Question ${i + 1}</span><span class="tiny muted">${q._e1 ? 'Épreuve 1' : 'Épreuve 2'}</span></div><div class="mt1">${q.q}</div>${res[i].ok ? '' : `<div class="fb ko"><div class="fb-h" style="font-size:.95rem">Réponse attendue : ${answerOf(q)}</div><div class="expl prose">${q.expl || ''}</div></div>`}</div>`).join('')}</div>
        <div class="row mt3"><a class="btn primary" href="#/examen/express${part !== 'all' ? '?part=' + part : ''}">🔁 Nouvel examen</a><a class="btn" href="#/erreurs">🩹 Carnet d'erreurs</a><a class="btn" href="#/examen">Retour</a></div>`;
      App.ui.hydrate(v);
      window.scrollTo(0, 0);
    }
  });

  function answerOf(q) {
    if (q.type === 'qcm') return q.choices[q.a];
    if (q.type === 'tf') return q.a ? 'Vrai' : 'Faux';
    if (q.type === 'multi') return q.a.map((i) => q.choices[i]).join(' + ');
    if (q.type === 'order') return q.items.join(' → ');
    if (q.type === 'match') return q.pairs.map((p) => p[0] + ' → ' + p[1]).join(' · ');
    if (q.type === 'input') return q.fields.map((f) => (f.label ? f.label + ' : ' : '') + U.esc(App.quiz.expected(f))).join(' · ');
    return '';
  }

  /* ---------- Sujet blanc (séance 9) ---------- */
  R.add('/examen/blanc', () => {
    const ex = App.content.extras.examBlanc;
    if (!ex) return R.go('/examen');
    App.layout.setTitle('Sujet blanc');
    const grades = {};
    let left = ex.minutes * 60, tid = null, phase = 'compose';
    const v = App.ui.mount(`
      ${App.ui.crumbs([['Examen', '#/examen'], ['Sujet blanc']])}
      <div class="page-head"><h1>📄 ${ex.title}</h1><div class="sub">${ex.sub}</div></div>
      <div class="card" style="position:sticky;top:.5rem;z-index:5"><div class="row between"><span class="timer" id="tm">${U.fmtDuration(left)}</span><span class="small muted" id="phaseLbl">Phase 1 : rédaction (corrigés masqués)</span><button class="btn sm primary" id="go">▶ Démarrer le chrono</button><button class="btn sm accent" id="end">Terminer → corriger</button></div></div>
      <div class="card mt2 prose">${ex.context}</div>
      <div id="secs" class="exam-locked"></div>
      <div id="result" class="mt2"></div>`);
    const secs = v.querySelector('#secs');
    let gi = 0;
    ex.sections.forEach((s) => {
      const box = U.el(`<div class="mt3"><h2>${s.title} <span class="chip pri">${s.max} pts</span></h2><div class="small muted mb1">${s.note || ''}</div><div class="card" data-host></div></div>`);
      const host = box.querySelector('[data-host]');
      s.items.forEach((it) => {
        const k = gi++;
        it._sec = s.id;
        host.appendChild(App.exo.partBlock(it, k, (kk, val) => { grades[kk] = { val, sec: s.id }; summary(); }, { rows: 4 }));
      });
      secs.appendChild(box);
    });
    const total = gi;
    v.querySelector('#go').addEventListener('click', (e) => {
      if (tid) return;
      e.target.disabled = true;
      tid = setInterval(() => {
        left--;
        const t = v.querySelector('#tm');
        if (!t) return clearInterval(tid);
        t.textContent = U.fmtDuration(Math.max(0, left));
        t.classList.toggle('low', left <= 600);
        if (left === 0) { App.ui.toast('⏰', '<b>Temps écoulé !</b> Passe à la correction.'); App.fx.sound('end'); }
      }, 1000);
    });
    v.querySelector('#end').addEventListener('click', () => {
      if (phase === 'grade') return;
      phase = 'grade';
      clearInterval(tid);
      secs.classList.remove('exam-locked');
      v.querySelector('#phaseLbl').textContent = 'Phase 2 : correction — ouvre chaque corrigé et note-toi honnêtement';
      App.ui.toast('🧑‍🏫', 'Ouvre les corrigés et attribue-toi les points selon le barème.');
      summary();
    });
    App.router.onLeave(() => clearInterval(tid));
    function summary() {
      const out = v.querySelector('#result');
      if (phase !== 'grade') { out.innerHTML = ''; return; }
      const n = Object.keys(grades).length;
      const p1 = U.sum(Object.values(grades).filter((g) => g.sec === 'I').map((g) => g.val));
      const p2 = U.sum(Object.values(grades).filter((g) => g.sec === 'II').map((g) => g.val));
      const sI = ex.sections.find((s) => s.id === 'I'), sII = ex.sections.find((s) => s.id === 'II');
      const e2 = (p1 * 20) / sI.max, e1 = (p2 * 20) / sII.max;
      out.innerHTML = `<div class="card"><h2>🧮 Ta note</h2><p class="muted small">${n}/${total} questions notées · Partie I : <b>${U.fmtNum(p1)}/${sI.max}</b> → E2 = ${U.fmtNum(p1)} × 20 / ${sI.max} · Partie II : <b>${U.fmtNum(p2)}/${sII.max}</b> → E1 = ${U.fmtNum(p2)} × 20 / ${sII.max}</p>
        ${verdict(e1, e2).html}
        <div class="center mt2"><button class="btn primary" id="saveEx" ${n < total ? 'disabled' : ''}>💾 Enregistrer le résultat</button>${n < total ? '<div class="tiny muted mt1">Note toutes les questions pour enregistrer.</div>' : ''}</div></div>`;
      const b = out.querySelector('#saveEx');
      b.addEventListener('click', () => { saveResult('Sujet blanc', e1, e2); b.disabled = true; b.textContent = '✓ Enregistré'; App.fx.confetti(0.8); });
    }
  });
})();

</script>

      rd.onload = () => {
        try { App.store.importJSON(rd.result); App.ui.applyTheme(); App.ui.toast('✅', 'Progression importée.'); R.go('/'); App.layout.refresh(); }
        catch (err) { App.ui.toast('⚠️', 'Fichier invalide : ' + U.esc(err.message)); }
      };
      rd.readAsText(f);
    });
    v.querySelector('#rst').addEventListener('click', () => App.ui.confirm('<h3>Tout réinitialiser ?</h3><p>XP, cartes, erreurs, badges et réglages seront effacés. Pense à exporter avant.</p>', 'Réinitialiser', () => { App.store.reset(); App.ui.applyTheme(); App.layout.refresh(); R.go('/'); }, true));
  });
})();

</script>
  <!-- Démarrage -->
  <script>
/* js/main.js */
/* Point d'entrée : charge la progression, applique le thème, dessine la coquille et démarre le routeur. */
(function () {
  'use strict';
  const App = window.App;

  function boot() {
    App.store.load();
    App.ui.applyTheme();
    if (window.matchMedia) {
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const onChange = () => { if (App.store.state.settings.theme === 'auto') App.ui.applyTheme(); };
      if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
    }
    App.layout.render();
    App.router.start();
    window.addEventListener('beforeunload', () => App.store.saveNow());
    document.addEventListener('visibilitychange', () => { if (document.hidden) App.store.saveNow(); });

    // Mode application installable quand la page est servie en http(s) (ex. GitHub Pages) : cache hors ligne.
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/localhost|127\.0\.0\.1/.test(location.hostname)) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
