/* js/core/quiz.js */
/* Logique de correction des questions (indépendante de l'affichage).
   Types : qcm, tf (vrai/faux), input (champs à saisir), order (remettre dans l'ordre), match (associer). */
(function () {
  'use strict';
  const App = window.App;
  const U = App.util;

  const asArr = (a) => (Array.isArray(a) ? a : [a]);

  const fieldCheckers = {
    ip(v, f) {
      const n = App.ip.parse(String(v).replace(/\s/g, ''));
      return n != null && asArr(f.a).some((a) => App.ip.parse(String(a)) === n);
    },
    cidr(v, f) {
      const s = String(v).replace(/\s/g, '');
      const m = s.match(/^(\d+\.\d+\.\d+\.\d+)\/(\d{1,2})$/);
      if (!m) return false;
      return asArr(f.a).some((a) => {
        const am = String(a).match(/^(\d+\.\d+\.\d+\.\d+)\/(\d{1,2})$/);
        return am && App.ip.parse(am[1]) === App.ip.parse(m[1]) && +am[2] === +m[2];
      });
    },
    mask(v, f) {
      const s = String(v).replace(/\s/g, '');
      let p;
      if (/^\/?\d{1,2}$/.test(s)) p = +s.replace('/', '');
      else {
        const n = App.ip.parse(s);
        if (n == null) return false;
        p = App.ip.prefixOf(n);
      }
      return asArr(f.a).some((a) => {
        const as = String(a);
        const ap = /^\/?\d{1,2}$/.test(as) ? +as.replace('/', '') : App.ip.prefixOf(App.ip.parse(as));
        return ap === p && p >= 0;
      });
    },
    num(v, f) {
      const n = U.parseNum(v);
      if (isNaN(n)) return false;
      return asArr(f.a).some((a) => {
        const an = typeof a === 'number' ? a : U.parseNum(a);
        const tol = f.tol != null ? f.tol : 0;
        const rel = f.rel != null ? Math.abs(an) * f.rel : 0;
        return Math.abs(n - an) <= Math.max(tol, rel) + 1e-9;
      });
    },
    v6(v, f) {
      const s = String(v).trim().toLowerCase();
      if (f.strict) return asArr(f.a).some((a) => String(a).toLowerCase() === s);
      const p = App.ip.v6.parse(s);
      return !!p && asArr(f.a).some((a) => {
        const ap = App.ip.v6.parse(String(a));
        return ap && ap.every((x, i) => x === p[i]);
      });
    },
    bin(v, f) {
      const s = String(v).replace(/[\s.]/g, '');
      return /^[01]+$/.test(s) && asArr(f.a).some((a) => String(a).replace(/[\s.]/g, '') === s);
    },
    hex(v, f) {
      const s = String(v).trim().toLowerCase().replace(/^0x/, '').replace(/^0+(?=.)/, '');
      return asArr(f.a).some((a) => String(a).toLowerCase().replace(/^0x/, '').replace(/^0+(?=.)/, '') === s);
    },
    text(v, f) {
      const s = U.norm(v).replace(/[.;]+$/, '');
      if (f.re) return new RegExp(f.re, 'i').test(U.norm(v));
      return asArr(f.a).some((a) => U.norm(a) === s);
    },
    code(v, f) {
      // commande : espaces multiples ignorés, casse respectée sauf option
      const n = (x) => String(x).trim().replace(/\s+/g, ' ');
      return asArr(f.a).some((a) => (f.ci ? n(a).toLowerCase() === n(v).toLowerCase() : n(a) === n(v)));
    },
    select(v, f) {
      return String(v) === String(f.a);
    }
  };

  const quiz = (App.quiz = {
    fieldCheckers,

    checkField(f, v) {
      if (v == null || String(v).trim() === '') return false;
      const kind = f.kind || 'text';
      const fn = fieldCheckers[kind] || fieldCheckers.text;
      try { return fn(v, f); } catch (e) { return false; }
    },

    expected(f) {
      if (f.show) return f.show;
      if (f.kind === 'select') return (f.opts || [])[f.a];
      const a = asArr(f.a)[0];
      return typeof a === 'number' ? U.fmtNum(a) : String(a);
    },

    /* Retourne { ok, score (0..1), fields: [bool] } */
    check(q, resp) {
      switch (q.type) {
        case 'qcm': {
          const ok = resp === q.a;
          return { ok, score: ok ? 1 : 0 };
        }
        case 'multi': {
          const want = q.a.slice().sort().join(',');
          const got = (resp || []).slice().sort().join(',');
          return { ok: want === got, score: want === got ? 1 : 0 };
        }
        case 'tf': {
          const ok = resp === q.a;
          return { ok, score: ok ? 1 : 0 };
        }
        case 'input': {
          const fields = q.fields.map((f, i) => quiz.checkField(f, (resp || [])[i]));
          const n = fields.filter(Boolean).length;
          return { ok: n === fields.length, score: n / fields.length, fields };
        }
        case 'order': {
          const fields = (resp || []).map((v, i) => v === i);
          const ok = resp && resp.length === q.items.length && fields.every(Boolean);
          return { ok: !!ok, score: fields.filter(Boolean).length / q.items.length, fields };
        }
        case 'match': {
          const fields = q.pairs.map((p, i) => (resp || [])[i] === i);
          const n = fields.filter(Boolean).length;
          return { ok: n === q.pairs.length, score: n / q.pairs.length, fields };
        }
        default:
          return { ok: false, score: 0 };
      }
    },

    /* XP pour une réponse */
    xpFor(q, result, combo) {
      if (!result.ok) return result.score > 0 ? Math.round(4 * result.score) : 1;
      const base = 10 + (q.level === 3 ? 6 : q.level === 2 ? 3 : 0) + (q.type === 'input' && q.fields.length > 2 ? 4 : 0);
      return Math.round(base * App.game.comboMult(combo));
    }
  });
})();

  <script>
/* js/views/question.js */
/* Vue : rendu interactif d'une question (QCM, vrai/faux, saisie, ordre, association). */
(function () {
  'use strict';
  const App = window.App;
  const U = App.util;
  const LETTERS = 'ABCDEFGHIJ';

  const qview = (App.qview = {
    /* opts : { mode: 'practice' | 'exam' | 'blitz', onAnswer(result, resp), onChange(resp), onNext(), initial, meta } */
    create(q, opts) {
      opts = opts || {};
      const mode = opts.mode || 'practice';
      const mod = q.mod ? App.content.mod(q.mod) : null;
      const el = U.el(`<div class="card q-card"></div>`);
      const api = { el, q, answered: false, resp: opts.initial != null ? opts.initial : null };

      const meta = [];
      if (opts.meta !== false) {
        if (mod) meta.push(`<span class="chip" style="background:color-mix(in srgb, ${mod.color} 15%, var(--surface));color:${mod.color}">${mod.icon} ${U.esc(mod.short || mod.title)}</span>`);
        if (q.src) meta.push(`<span class="chip">${U.esc(q.src)}</span>`);
        if (q.gen) meta.push(`<span class="chip pri">♾️ généré</span>`);
        if (q.level) meta.push(`<span class="chip warn">${'★'.repeat(q.level)}</span>`);
        if (App.store.state.errors[App.progress.errKey(q)]) meta.push('<span class="chip ko">🩹 déjà ratée</span>');
      }
      el.innerHTML = `
        ${meta.length ? `<div class="q-meta">${meta.join('')}</div>` : ''}
        <div class="q-text">${q.q}</div>
        <div class="q-body"></div>
        <div class="q-fb"></div>
        <div class="q-actions"></div>`;
      const body = el.querySelector('.q-body');
      const fbBox = el.querySelector('.q-fb');
      const actions = el.querySelector('.q-actions');

      /* ---------- Rendus par type ---------- */
      let order = null; // ordre d'affichage des choix
      if (q.type === 'qcm' || q.type === 'multi') {
        order = q.noShuffle || mode === 'exam-fixed' ? q.choices.map((_, i) => i) : U.shuffle(q.choices.map((_, i) => i));
        if (q._order) order = q._order; else q._order = order; // ordre stable si la question est réaffichée
        body.innerHTML = `<div class="choices">${order.map((ci, di) => `<button class="choice" data-ci="${ci}"><span class="letter">${LETTERS[di]}</span><span>${q.choices[ci]}</span></button>`).join('')}</div>`;
        if (q.type === 'multi') body.insertAdjacentHTML('afterbegin', '<p class="small muted">Plusieurs réponses possibles.</p>');
        U.$$('.choice', body).forEach((b) => b.addEventListener('click', () => pick(+b.dataset.ci)));
        if (mode === 'exam' && api.resp != null) markPicked();
      } else if (q.type === 'tf') {
        body.innerHTML = `<div class="grid c2"><button class="choice" data-v="1"><span class="letter">V</span><span>Vrai</span></button><button class="choice" data-v="0"><span class="letter">F</span><span>Faux</span></button></div>`;
        U.$$('.choice', body).forEach((b) => b.addEventListener('click', () => pick(b.dataset.v === '1')));
        if (mode === 'exam' && api.resp != null) markPicked();
      } else if (q.type === 'input') {
        body.innerHTML = `<div class="fields">${q.fields.map((f, i) => {
          const im = f.kind === 'num' ? 'decimal' : 'text';
          const ctl = f.kind === 'select'
            ? `<select class="select input" data-i="${i}"><option value="">— choisir —</option>${f.opts.map((o, j) => `<option value="${j}">${o}</option>`).join('')}</select>`
            : `<input class="input ${/ip|cidr|mask|v6|bin|hex|code|num/.test(f.kind || '') ? 'mono' : ''}" data-i="${i}" inputmode="${im}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${U.esc(f.ph || '')}">`;
          return `<div class="field" style="${f.wide ? 'grid-column:1/-1' : ''}"><label class="lbl">${f.label || 'Réponse'}</label>${ctl}<div class="exp"></div></div>`;
        }).join('')}</div>`;
        if (q.fields.length === 1 && !q.fields[0].label) body.querySelector('.lbl').remove();
        const ins = U.$$('.input', body);
        ins.forEach((inp, i) => {
          if (api.resp && api.resp[i] != null) inp.value = api.resp[i];
          inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              e.stopPropagation();
              const next = ins[i + 1];
              if (next && inp.value.trim() && !next.value.trim()) next.focus();
              else if (mode !== 'exam') submit();
            }
          });
          inp.addEventListener('input', () => { api.resp = ins.map((x) => x.value); if (opts.onChange) opts.onChange(api.resp); });
          inp.addEventListener('change', () => { api.resp = ins.map((x) => x.value); if (opts.onChange) opts.onChange(api.resp); });
        });
      } else if (q.type === 'order') {
        const shuffled = q._order || U.shuffle(q.items.map((_, i) => i));
        q._order = shuffled;
        let picked = Array.isArray(api.resp) ? api.resp.slice() : [];
        const draw = () => {
          body.innerHTML = `<p class="small muted mb1">Touchez les éléments dans le bon ordre (touchez un élément placé pour le retirer).</p>
            <div class="order-picked">${picked.length ? picked.map((ii, k) => `<button class="tok" data-p="${k}"><span class="i">${k + 1}</span>${q.items[ii]}</button>`).join('') : '<span class="muted small" style="padding:.4rem">Votre ordre apparaîtra ici…</span>'}</div>
            <div class="order-pool">${shuffled.filter((ii) => !picked.includes(ii)).map((ii) => `<button class="tok" data-ii="${ii}">${q.items[ii]}</button>`).join('')}</div>`;
          U.$$('[data-ii]', body).forEach((b) => b.addEventListener('click', () => { if (api.answered) return; picked.push(+b.dataset.ii); api.resp = picked.slice(); draw(); if (opts.onChange) opts.onChange(api.resp); if (picked.length === q.items.length && mode === 'practice') submit(); }));
          U.$$('[data-p]', body).forEach((b) => b.addEventListener('click', () => { if (api.answered) return; picked.splice(+b.dataset.p, 1); api.resp = picked.slice(); draw(); if (opts.onChange) opts.onChange(api.resp); }));
        };
        draw();
        api._drawOrder = (res) => {
          const pk = U.$$('.order-picked .tok', body);
          pk.forEach((b, k) => b.classList.add(res.fields[k] ? 'ok' : 'ko'));
        };
      } else if (q.type === 'match') {
        const rightOrder = q._rorder || U.shuffle(q.pairs.map((_, i) => i));
        q._rorder = rightOrder;
        body.innerHTML = q.pairs.map((p, i) => `<div class="match-row"><div><b>${p[0]}</b></div><select class="select input" data-i="${i}"><option value="">— associer —</option>${rightOrder.map((ri) => `<option value="${ri}">${q.pairs[ri][1]}</option>`).join('')}</select></div>`).join('');
        const sels = U.$$('select', body);
        sels.forEach((s, i) => {
          if (api.resp && api.resp[i] != null) s.value = api.resp[i];
          s.addEventListener('change', () => { api.resp = sels.map((x) => (x.value === '' ? null : +x.value)); if (opts.onChange) opts.onChange(api.resp); });
        });
      }

      /* ---------- Actions ---------- */
      const needsSubmit = q.type === 'input' || q.type === 'match' || q.type === 'multi' || q.type === 'order';
      if (mode !== 'exam') {
        actions.innerHTML = `
          ${q.hint ? '<button class="btn ghost sm" data-hint>💡 Indice</button>' : ''}
          <button class="btn ghost sm" data-skip>Je ne sais pas</button>
          <span class="grow"></span>
          ${needsSubmit ? '<button class="btn primary" data-submit>Valider <span class="k">Entrée</span></button>' : ''}`;
        const hintB = actions.querySelector('[data-hint]');
        if (hintB) hintB.addEventListener('click', () => { fbBox.innerHTML = `<div class="fb partial"><div class="fb-h">💡 Indice</div><div class="expl">${q.hint}</div></div>`; hintB.remove(); });
        actions.querySelector('[data-skip]').addEventListener('click', () => submit(true));
        const sb = actions.querySelector('[data-submit]');
        if (sb) sb.addEventListener('click', () => submit());
      }

      function markPicked() {
        U.$$('.choice', body).forEach((b) => {
          const v = q.type === 'tf' ? b.dataset.v === '1' : +b.dataset.ci;
          const on = q.type === 'multi' ? (api.resp || []).includes(v) : api.resp === v;
          b.classList.toggle('picked', on);
        });
      }

      function pick(v) {
        if (api.answered) return;
        if (q.type === 'multi') {
          const cur = api.resp || [];
          api.resp = cur.includes(v) ? cur.filter((x) => x !== v) : cur.concat([v]);
          markPicked();
          if (opts.onChange) opts.onChange(api.resp);
          return;
        }
        api.resp = v;
        if (mode === 'exam') { markPicked(); if (opts.onChange) opts.onChange(v); return; }
        submit();
      }

      function collect() {
        if (q.type === 'input') return U.$$('.input', body).map((x) => x.value);
        if (q.type === 'match') return U.$$('select', body).map((x) => (x.value === '' ? null : +x.value));
        return api.resp;
      }

      function submit(skip) {
        if (api.answered) { if (opts.onNext) opts.onNext(); return; }
        let resp = skip ? null : collect();
        if (!skip && q.type === 'input' && resp.every((v) => !String(v).trim())) {
          const first = body.querySelector('.input');
          if (first) { first.focus(); first.classList.add('ko'); setTimeout(() => first.classList.remove('ko'), 600); }
          return;
        }
        if (!skip && q.type === 'order' && (!resp || resp.length < q.items.length)) return;
        api.resp = resp;
        const res = skip ? { ok: false, score: 0, fields: (q.fields || q.pairs || q.items || []).map(() => false), skipped: true } : App.quiz.check(q, resp);
        api.answered = true;
        api.result = res;
        showResult(res);
        if (opts.onAnswer) opts.onAnswer(res, resp);
      }

      function showResult(res) {
        // états visuels
        if (q.type === 'qcm' || q.type === 'tf') {
          U.$$('.choice', body).forEach((b) => {
            b.disabled = true;
            const v = q.type === 'tf' ? b.dataset.v === '1' : +b.dataset.ci;
            if (v === q.a) b.classList.add('correct');
            else if (v === api.resp) b.classList.add('wrong');
          });
        } else if (q.type === 'multi') {
          U.$$('.choice', body).forEach((b) => {
            b.disabled = true;
            const v = +b.dataset.ci;
            if (q.a.includes(v)) b.classList.add('correct');
            else if ((api.resp || []).includes(v)) b.classList.add('wrong');
          });
        } else if (q.type === 'input') {
          U.$$('.field', body).forEach((fd, i) => {
            const inp = fd.querySelector('.input');
            inp.disabled = true;
            const ok = res.fields[i];
            inp.classList.add(ok ? 'ok' : 'ko');
            const exp = fd.querySelector('.exp');
            exp.className = 'exp ' + (ok ? 'ok' : 'ko');
            exp.innerHTML = ok ? '✓ juste' : '→ ' + U.esc(App.quiz.expected(q.fields[i]));
          });
        } else if (q.type === 'order') {
          if (!res.skipped && api._drawOrder) api._drawOrder(res);
        } else if (q.type === 'match') {
          U.$$('select', body).forEach((s, i) => {
            s.disabled = true;
            s.classList.add(res.fields[i] ? 'ok' : 'ko');
            if (!res.fields[i]) s.insertAdjacentHTML('afterend', `<div class="exp ko small mono" style="grid-column:2">→ ${q.pairs[i][1]}</div>`);
          });
        }
        if (mode === 'blitz') {
          el.classList.add(res.ok ? 'flash-ok' : 'flash-ko');
          if (!res.ok) fbBox.innerHTML = `<div class="fb ko"><div class="fb-h">✗ Réponse : ${answerText()}</div></div>`;
          return;
        }
        const head = res.ok ? '✅ Exact !' : res.skipped ? '📘 Voici la réponse' : res.score > 0 ? '🟠 Presque…' : '❌ Pas tout à fait';
        const cls = res.ok ? 'ok' : res.score > 0 ? 'partial' : 'ko';
        const corrList = !res.ok && (q.type === 'qcm' || q.type === 'tf' || q.type === 'order') ? `<p><b>Bonne réponse :</b> ${answerText()}</p>` : '';
        fbBox.innerHTML = `<div class="fb ${cls}"><div class="fb-h">${head}</div><div class="expl prose">${corrList}${q.expl || ''}</div></div>`;
        App.ui.hydrate(fbBox);
        actions.innerHTML = `<span class="grow"></span><button class="btn primary" data-next>Continuer <span class="k">Entrée</span></button>`;
        actions.querySelector('[data-next]').addEventListener('click', () => opts.onNext && opts.onNext());
        setTimeout(() => { const nb = actions.querySelector('[data-next]'); if (nb) nb.focus({ preventScroll: true }); }, 30);
      }

      function answerText() {
        if (q.type === 'qcm') return q.choices[q.a];
        if (q.type === 'multi') return q.a.map((i) => q.choices[i]).join(' + ');
        if (q.type === 'tf') return q.a ? 'Vrai' : 'Faux';
        if (q.type === 'order') return q.items.map((t, i) => `${i + 1}. ${t}`).join(' → ');
        if (q.type === 'input') return q.fields.map((f) => (f.label ? f.label + ' : ' : '') + App.quiz.expected(f)).join(' · ');
        if (q.type === 'match') return q.pairs.map((p) => p[0] + ' → ' + p[1]).join(' · ');
        return '';
      }

      /* Raccourcis clavier délégués par le contrôleur */
      api.key = (e) => {
        const k = e.key;
        if (k === 'Enter') {
          if (e.target && /^(BUTTON|SELECT|A|TEXTAREA)$/.test(e.target.tagName)) return; // l'élément gère son propre clic
          if (api.answered) { e.preventDefault(); if (opts.onNext) opts.onNext(); return; }
          if (needsSubmit && mode !== 'exam' && !(e.target && e.target.tagName === 'INPUT')) { e.preventDefault(); submit(); }
          return;
        }
        if (api.answered || mode === 'exam') return;
        if ((q.type === 'qcm' || q.type === 'multi') && e.target.tagName !== 'INPUT') {
          let di = -1;
          if (/^[1-9]$/.test(k)) di = +k - 1;
          else if (/^[a-j]$/i.test(k)) di = LETTERS.indexOf(k.toUpperCase());
          if (di >= 0 && order && di < order.length) pick(order[di]);
        }
        if (q.type === 'tf' && e.target.tagName !== 'INPUT') {
          if (/^[v1]$/i.test(k)) pick(true);
          if (/^[f2]$/i.test(k)) pick(false);
        }
      };
      api.submit = submit;
      api.answerText = answerText;
      api.focus = () => {
        const inp = body.querySelector('.input');
        if (inp && window.innerWidth > 880) inp.focus({ preventScroll: true });
      };
      return api;
    }
  });
})();

/* js/core/gen.js */
/* Registre des générateurs d'exercices infinis. Chaque question générée est reproductible (graine). */
(function () {
  'use strict';
  const App = window.App;
  const U = App.util;

  const gen = (App.gen = {
    list: [],
    byId: {},
    /* def : { id, title, mod, icon, desc, levels: ['Facile','Moyen','Difficile'], make(r, level) → question, quick?(r) → question } */
    register(def) {
      def.levels = def.levels || ['Facile', 'Moyen', 'Difficile'];
      gen.list.push(def);
      gen.byId[def.id] = def;
    },
    make(id, level, seed, quick) {
      const def = gen.byId[id];
      if (!def) return null;
      seed = seed == null ? U.seed() : seed;
      const r = U.rng(seed);
      const lvl = level || 1;
      const q = quick && def.quick ? def.quick(r, lvl) : def.make(r, lvl);
      q.gen = id;
      q.mod = q.mod || def.mod;
      q.level = q.level || lvl;
      q.seed = seed;
      q.id = 'gen:' + id + ':' + seed;
      q.type = q.type || 'input';
      return q;
    },
    /* Mélange de plusieurs générateurs (défi éclair, examen express) */
    mixer(ids, level, quick) {
      return () => {
        const id = U.pick(ids);
        const lv = Array.isArray(level) ? U.pick(level) : level || U.R.int(1, 2);
        return gen.make(id, lv, null, quick);
      };
    },
    forModule(mod) { return gen.list.filter((g) => g.mod === mod); }
  });

  /* Packs du « défi éclair » (60 s chrono) */
  gen.BLITZ = [
    { id: 'binaire', title: 'Binaire ↔ décimal', icon: '🤖', ids: ['bin-d2b', 'bin-b2d'], level: [1, 2] },
    { id: 'masques', title: 'Masques & préfixes', icon: '🎭', ids: ['mask', 'hosts'], level: [1, 2] },
    { id: 'reseau', title: 'Adresse réseau express', icon: '⚡', ids: ['subnet'], level: [1, 2], quick: true },
    { id: 'ipv6', title: 'IPv6 express', icon: '🛰️', ids: ['v6-type', 'v6-compress'], level: [1, 2] },
    { id: 'ports', title: 'Ports & protocoles', icon: '🔌', ids: ['ports'], level: [1, 2] },
    { id: 'sys', title: 'Droits Linux & cron', icon: '🐧', ids: ['chmod', 'umask', 'cron-read'], level: [1, 2] },

  <script>
/* js/widgets/core.js */
/* Widgets interactifs insérables dans les leçons : registre + pas-à-pas + diagrammes de séquence animés. */
(function () {
  'use strict';
  const App = window.App;
  const U = App.util;
  const reg = {};

  const widgets = (App.widgets = {
    register(name, fn) { reg[name] = fn; },
    hydrate(root) {
      U.$$('[data-w]', root).forEach((el) => {
        if (el._w) return;
        el._w = true;
        const fn = reg[el.dataset.w];
        if (!fn) return;
        try { fn(el, el.dataset); } catch (e) { console.error('widget', el.dataset.w, e); }
      });
    },
    /* Insère un widget dans un conteneur (pour les pages Labs) */
    render(name, data) {
      const el = document.createElement('div');
      el.dataset.w = name;
      Object.entries(data || {}).forEach(([k, v]) => (el.dataset[k] = typeof v === 'string' ? v : JSON.stringify(v)));
      return el;
    }
  });

  /* ---------- Pas-à-pas ---------- */
  widgets.register('stepper', (el, d) => {
    const steps = U.$$(':scope > .st-step', el);
    if (!steps.length) return;
    el.classList.add('widget', 'stepper');
    const head = U.el(`<div class="w-h">👣 ${U.esc(d.title || 'Pas à pas')}</div>`);
    el.prepend(head);
    const nav = U.el(`<div class="st-nav"><button class="btn sm" data-p>◀</button><div class="dots">${steps.map((_, i) => `<i data-i="${i}"></i>`).join('')}</div><span class="small muted" data-c></span><button class="btn sm primary" data-n>Suivant ▶</button></div>`);
    el.appendChild(nav);
    let i = 0;
    const go = (k) => {
      i = U.clamp(k, 0, steps.length - 1);
      steps.forEach((s, j) => s.classList.toggle('on', j === i));
      U.$$('.dots i', nav).forEach((dd, j) => dd.classList.toggle('on', j === i));
      nav.querySelector('[data-c]').textContent = `${i + 1}/${steps.length}`;
      nav.querySelector('[data-p]').disabled = i === 0;
      nav.querySelector('[data-n]').textContent = i === steps.length - 1 ? '↺ Recommencer' : 'Suivant ▶';
      App.ui.hydrate(steps[i]);
    };
    nav.querySelector('[data-p]').addEventListener('click', () => go(i - 1));
    nav.querySelector('[data-n]').addEventListener('click', () => go(i === steps.length - 1 ? 0 : i + 1));
    U.$$('.dots i', nav).forEach((dd) => dd.addEventListener('click', () => go(+dd.dataset.i)));
    go(0);
  });

  /* ---------- Diagramme de séquence animé ----------
     data-seq = { title, actors: ['Client','Serveur'], msgs: [{ from:0, to:1, label:'SYN', sub:'seq=100', bc:false, note:'…' }] } */
  widgets.register('seq', (el, d) => {
    let spec;
    try { spec = JSON.parse(d.seq); } catch (e) { spec = App.content.extras.seqs && App.content.extras.seqs[d.seq]; }
    if (!spec) return;
    const n = spec.actors.length;
    el.classList.add('widget');
    const center = (i) => ((i + 0.5) / n) * 100;
    el.innerHTML = `
      <div class="w-h">🎬 ${U.esc(spec.title || 'Échange animé')}</div>
      <div class="seq">
        <div class="actors" style="grid-template-columns:repeat(${n},1fr)">${spec.actors.map((a) => `<div class="actor">${a}</div>`).join('')}</div>
        <div class="lanes">
          ${spec.actors.map((_, i) => `<div class="lifeline" style="left:${center(i)}%"></div>`).join('')}
          ${spec.msgs.map((m, k) => {
            const a = center(m.from), b = center(m.to);
            const left = Math.min(a, b), w = Math.abs(a - b);
            return `<div class="msg" data-k="${k}"><div class="lbl" style="left:${left}%;width:${w}%">${m.label}${m.sub ? `<br><small>${m.sub}</small>` : ''}</div><div class="arrow ${b > a ? 'r' : 'l'} ${m.bc ? 'bc' : ''}" style="left:${left}%;width:${w}%"></div></div>`;
          }).join('')}
        </div>
      </div>
      <div class="seq-note"></div>
      <div class="row mt1"><button class="btn sm" data-reset>↺</button><span class="grow small muted" data-c></span><button class="btn sm soft" data-all>Tout afficher</button><button class="btn sm primary" data-next>Étape suivante ▶</button></div>`;
    const msgs = U.$$('.msg', el);
    const note = el.querySelector('.seq-note');
    let k = 0;
    const upd = () => {
      msgs.forEach((m, j) => m.classList.toggle('on', j < k));
      const last = spec.msgs[k - 1];
      note.innerHTML = k === 0 ? (spec.intro || 'Clique sur « Étape suivante » pour dérouler l\'échange.') : last.note || '';
      el.querySelector('[data-c]').textContent = `${k}/${msgs.length}`;
      el.querySelector('[data-next]').disabled = k >= msgs.length;
    };
    el.querySelector('[data-next]').addEventListener('click', () => { if (k < msgs.length) { k++; App.fx.sound('tick'); upd(); } });
    el.querySelector('[data-reset]').addEventListener('click', () => { k = 0; upd(); });
    el.querySelector('[data-all]').addEventListener('click', () => { k = msgs.length; upd(); note.innerHTML = spec.outro || note.innerHTML; });
    upd();
  });

  /* ---------- Quiz express inline (une question dans le cours) ----------
     data-q = id d'une question enregistrée */
  widgets.register('q', (el, d) => {
    const q = App.content.questions[d.q];
    if (!q) return;
    const api = App.qview.create(q, {
      mode: 'practice',
      onAnswer: (res) => {
        App.progress.record(q, res.ok);
        App.game.addXP(App.quiz.xpFor(q, res, 0), api.el.querySelector('.q-text'));
        App.fx.sound(res.ok ? 'ok' : 'ko');
      },
      onNext: () => {}
    });
    el.appendChild(api.el);
  });
})();

</script>
  <script>
/* js/widgets/ip.js */
/* Widgets d'adressage : octet interactif, visualiseur de sous-réseau, planificateur VLSM, agrégation, IPv6. */
(function () {
  'use strict';
  const App = window.App;
  const U = App.util;
  const IP = App.ip;
  const W = App.widgets;
  const bits = (n, p, o) => App.ui.bits32(n, p, o);
  const POW = [128, 64, 32, 16, 8, 4, 2, 1];

  /* ---------- Octet à cliquer (128 64 32 16 8 4 2 1) + défi ---------- */
  W.register('bits8', (el, d) => {
    el.classList.add('widget');
    let val = +(d.value || 0);
    let target = null;
    el.innerHTML = `
      <div class="w-h">🔢 L'octet interactif — clique sur les bits</div>
      <div class="octet-toggler">${POW.map((w, i) => `<button class="bitbtn" data-i="${i}"><span class="w">${w}</span><span class="v">0</span></button>`).join('')}</div>
      <div class="row mt2" style="align-items:flex-end">
        <div><div class="tiny muted">Décimal</div><div class="bignum pri-t" data-dec>0</div></div>
        <div><div class="tiny muted">Hexa</div><div class="bignum" style="font-size:1.6rem" data-hex>00</div></div>
        <div class="grow small muted" data-sum></div>
      </div>
      <div class="row mt2">
        <input class="input mono" style="max-width:150px" inputmode="numeric" placeholder="Tape 0-255" data-in>
        <button class="btn sm" data-clear>Effacer</button>
        <button class="btn sm accent" data-chal>🎯 Défi : compose un nombre</button>
        <span class="grow"></span>
      </div>
      <div class="seq-note mt1" data-note>Astuce : un masque n'utilise que des 1 « collés à gauche » → 128, 192, 224, 240, 248, 252, 254, 255.</div>`;
    const btns = U.$$('.bitbtn', el);
    const upd = () => {
      btns.forEach((b, i) => {
        const on = (val >> (7 - i)) & 1;
        b.classList.toggle('on', !!on);
        b.querySelector('.v').textContent = on;
      });
      el.querySelector('[data-dec]').textContent = val;
      el.querySelector('[data-hex]').textContent = val.toString(16).toUpperCase().padStart(2, '0');
      const parts = POW.filter((w, i) => (val >> (7 - i)) & 1);
      el.querySelector('[data-sum]').innerHTML = parts.length ? parts.join(' + ') + ' = <b>' + val + '</b>' : 'Tous les bits à 0 = 0';
      if (target != null && val === target) {
        el.querySelector('[data-note]').innerHTML = `✅ Bravo ! <b>${target}</b> = <span class="mono">${IP.bin8(target)}</span>. Nouveau défi ?`;
        App.fx.sound('ok');
        App.game.addXP(3, el.querySelector('[data-dec]'));
        App.progress.record({ gen: 'bin-octet', mod: 'm0', q: 'défi octet' }, true);
        target = null;
      }
    };
    btns.forEach((b) => b.addEventListener('click', () => { val ^= 1 << (7 - +b.dataset.i); App.fx.sound('tick'); upd(); }));
    el.querySelector('[data-in]').addEventListener('input', (e) => {
      const n = parseInt(e.target.value, 10);
      if (n >= 0 && n <= 255) {
        val = n;
        upd();
        // méthode des soustractions
        let r = n; const steps = [];
        POW.forEach((w) => { if (r >= w) { steps.push(`${r} − ${w} = ${r - w} → bit <b>1</b>`); r -= w; } });
        el.querySelector('[data-note]').innerHTML = steps.length ? '<b>Méthode des soustractions :</b> ' + steps.join(' · ') : '0 → 00000000';
      }
    });
    el.querySelector('[data-clear]').addEventListener('click', () => { val = 0; upd(); });
    el.querySelector('[data-chal]').addEventListener('click', () => {
      const pool = [192, 224, 240, 248, 252, 254, 172, 168, 200, 130, 100, 63, 127, 45, 99, 10, 20, 64, 96, 160, 176, 208, 232, 77, 150];
      target = U.pick(pool);
      val = 0;
      upd();
      el.querySelector('[data-note]').innerHTML = `🎯 Compose <b class="acc-t" style="font-size:1.2rem">${target}</b> en allumant les bons bits.`;
    });
    upd();
  });

  /* ---------- Visualiseur de sous-réseau (ET logique, nombre magique) ---------- */
  W.register('ipviz', (el, d) => {
    el.classList.add('widget');
    const init = d.ip || '172.16.45.200/20';
    el.innerHTML = `
      <div class="w-h">🔬 Visualiseur de sous-réseau — tape une adresse et bouge le curseur</div>
      <div class="row">
        <input class="input mono grow" style="max-width:260px" value="${U.esc(init)}" data-in aria-label="Adresse IP/préfixe">
        <span class="chip pri" data-pfx></span>
      </div>
      <input type="range" min="0" max="32" class="mt1" data-r aria-label="Préfixe">
      <div class="legend mt1"><span><i style="background:var(--net)"></i>partie réseau</span><span><i style="background:var(--host)"></i>partie hôte</span></div>
      <div class="mt1" data-rows></div>
      <div class="lab-out mt1" data-out></div>
      <div class="co ex mt2" data-magic></div>`;
    const inp = el.querySelector('[data-in]');
    const rng = el.querySelector('[data-r]');
    const render = () => {
      const m = inp.value.trim().match(/^(\d+\.\d+\.\d+\.\d+)\s*\/\s*(\d{1,2})$/);
      const a = m ? IP.parse(m[1]) : null;
      const p = m ? +m[2] : NaN;
      if (a == null || !(p >= 0 && p <= 32)) {
        el.querySelector('[data-rows]').innerHTML = '<p class="ko-t small">Format attendu : 192.168.10.130/26</p>';
        return;
      }
      rng.value = p;
      const c = IP.calc(a, p);
      el.querySelector('[data-pfx]').textContent = '/' + p + ' = ' + IP.str(c.mask);
      const row = (lab, n, pp, extra) => `<div class="binrow"><span class="lab">${lab}</span><span>${bits(n, pp, { sm: true })}</span><span class="dec">${IP.str(n)}${extra || ''}</span></div>`;
      el.querySelector('[data-rows]').innerHTML =
        row('Adresse', a, p) +
        row('Masque', c.mask, p) +
        `<div class="small muted" style="margin:.2rem 0 .2rem 0">ET logique (AND) bit à bit ⤵ : 1 ET 1 = 1, sinon 0</div>` +
        row('<b>Réseau</b>', c.net, p) +
        row('Broadcast', c.bc, p, '') ;
      const cell = (l, v) => `<div class="cell"><div class="l">${l}</div><div class="v">${v}</div></div>`;
      el.querySelector('[data-out]').innerHTML =
        cell('Réseau', IP.str(c.net) + '/' + p) +
        cell('Broadcast', IP.str(c.bc)) +
        cell('1er hôte', IP.str(c.first)) +
        cell('Dernier hôte', IP.str(c.last)) +
        cell('Hôtes utilisables', U.fmtNum(c.hosts)) +
        cell('Masque', IP.str(c.mask)) +
        cell('Wildcard', IP.str(c.wild)) +
        cell('Classe (historique)', c.cls) +
        cell('Type', c.type.label) +
        (c.isNet ? cell('⚠️ Attention', 'C\'est l\'adresse réseau') : '') +
        (c.isBc ? cell('⚠️ Attention', 'C\'est le broadcast') : '');
      // méthode du nombre magique
      const mg = el.querySelector('[data-magic]');
      if (p === 32) { mg.innerHTML = '<div class="co-h">🧮 /32</div>Route d\'hôte : une seule adresse (ex. loopback d\'un routeur).'; return; }
      if (p % 8 === 0) {
        const k = p / 8;
        mg.innerHTML = `<div class="co-h">🧮 Masque aligné sur l'octet</div>Avec /${p}, les ${k} premier(s) octet(s) forment le réseau, le reste est à 0 pour l'adresse réseau et à 255 pour le broadcast. Hôtes = 2<sup>${32 - p}</sup> − 2 = <b>${U.fmtNum(c.hosts)}</b>.`;
        return;
      }
      const o = c.oct, mv = IP.octets(c.mask)[o], b = 256 - mv, v = IP.octets(a)[o];
      const netO = Math.floor(v / b) * b;
      const names = ['1er', '2e', '3e', '4e'];
      mg.innerHTML = `<div class="co-h">🧮 Méthode du nombre magique (sans binaire)</div>
        <ol class="steps">
          <li>Octet intéressant : le <b>${names[o]}</b> (masque = <b>${mv}</b>, ni 255 ni 0).</li>
          <li>Bloc = 256 − ${mv} = <b class="acc-t">${b}</b> → les réseaux avancent de ${b} en ${b} : ${[0, 1, 2, 3].map((i) => i * b).filter((x) => x < 256).join(', ')}…</li>
          <li>Valeur de l'IP dans cet octet : <b>${v}</b> → plus grand multiple de ${b} ≤ ${v} = <b class="pri-t">${netO}</b> → réseau <b>${IP.str(c.net)}</b>.</li>
          <li>Broadcast = ${netO} + ${b} − 1 = <b>${netO + b - 1}</b>${o < 3 ? ' (octets suivants à 255)' : ''} → <b>${IP.str(c.bc)}</b>.</li>
          <li>Hôtes = 2<sup>${32 - p}</sup> − 2 = <b>${U.fmtNum(c.hosts)}</b> (de ${IP.str(c.first)} à ${IP.str(c.last)}).</li>
        </ol>`;
    };
    inp.addEventListener('input', render);
    rng.addEventListener('input', () => {
      const ipPart = inp.value.split('/')[0].trim();
      inp.value = ipPart + '/' + rng.value;
      render();
    });
    render();
  });

  /* ---------- Échelle des masques (valeurs à connaître) ---------- */
  W.register('masks', (el) => {
    el.classList.add('widget');
    const rows = [1, 2, 3, 4, 5, 6, 7, 8].map((k) => {
      const v = 256 - Math.pow(2, 8 - k);
      return [k, v];
    });
    el.innerHTML = `<div class="w-h">🪜 L'échelle des 8 valeurs de masque</div>
      <div class="tbl-wrap"><table class="t"><thead><tr><th>Bits à 1</th><th>Binaire</th><th>Valeur</th><th>Bloc (256 − v)</th><th>Préfixes</th></tr></thead><tbody>
      ${rows.map(([k, v]) => `<tr><td>${k}</td><td>${App.md.bits(IP.bin8(v), k, { sm: true })}</td><td class="mono"><b>${v}</b></td><td class="mono acc-t"><b>${256 - v}</b></td><td class="mono small">/${k} · /${8 + k} · /${16 + k} · /${24 + k}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="small muted mb0">Lecture : on ajoute à chaque fois la moitié de ce qu'on vient d'ajouter : 128 → +64 = 192 → +32 = 224 → +16 = 240 → +8 = 248 → +4 = 252 → +2 = 254 → +1 = 255.</p>`;
  });

  /* ---------- Planificateur VLSM ---------- */
  W.register('vlsm', (el, d) => {
    el.classList.add('widget');
    const base = d.base || '10.20.0.0/22';
    const needs = d.needs || 'Admin & Finances 300\nImpôts 200\nZinder 100\nTahoua 60\nDMZ 25\nWAN Niamey-Zinder 2\nWAN Niamey-Tahoua 2\nWAN Zinder-Tahoua 2';
    el.innerHTML = `
      <div class="w-h">🏗️ Planificateur VLSM — vérifie tes plans d'adressage</div>
      <div class="grid c2">
        <div><label class="lbl">Bloc disponible</label><input class="input mono" data-b value="${U.esc(base)}"></div>
        <div><label class="lbl">Besoins (un par ligne : nom + nombre d'hôtes, passerelle comprise)</label><textarea class="input mono" rows="6" data-n>${U.esc(needs)}</textarea></div>
      </div>
      <div class="mt1" data-alloc></div>
      <div data-out class="mt1"></div>`;
    const colors = ['#5b4bff', '#ff7a1a', '#10a861', '#1f86e8', '#e5383b', '#d946ef', '#0ea5e9', '#f59e0b', '#14b8a6', '#64748b'];
    const render = () => {
      const m = el.querySelector('[data-b]').value.trim().match(/^(\d+\.\d+\.\d+\.\d+)\/(\d{1,2})$/);
      const out = el.querySelector('[data-out]');
      if (!m || IP.parse(m[1]) == null) { out.innerHTML = '<p class="ko-t small">Bloc invalide (ex. 10.20.0.0/22)</p>'; return; }
      const list = el.querySelector('[data-n]').value.split('\n').map((l) => l.trim()).filter(Boolean).map((l) => {
        const mm = l.match(/^(.*?)[\s:]+(\d+)$/);
        return mm ? { name: mm[1].trim(), hosts: +mm[2] } : null;
      }).filter(Boolean);
      if (!list.length) { out.innerHTML = ''; return; }
      const r = IP.vlsm(m[1], +m[2], list);
      const totalSize = r.total;
      el.querySelector('[data-alloc]').innerHTML = `<div class="alloc">${r.plan.map((x, i) => `<div style="width:${(x.size / totalSize) * 100}%;background:${colors[i % colors.length]}" title="${U.esc(x.name)}">${x.size / totalSize > 0.06 ? U.esc(x.name.split(' ')[0]) : ''}</div>`).join('')}</div>
        <div class="small mt1 ${r.ok ? 'ok-t' : 'ko-t'}"><b>${U.fmtNum(r.used)}</b> adresses utilisées sur <b>${U.fmtNum(totalSize)}</b> ${r.ok ? '✓ ça tient' : '✗ ça ne tient pas !'} — libres : ${U.fmtNum(Math.max(0, totalSize - r.used))}</div>`;
      out.innerHTML = App.md.table(['Réseau', 'Besoin', 'Taille', 'Préfixe / masque', 'Adresse réseau', 'Plage d\'hôtes', 'Broadcast'],
        r.plan.map((x, i) => [
          `<span style="color:${colors[i % colors.length]};font-weight:800">■</span> ${U.esc(x.name)}`, x.hosts, x.size,
          `/${x.p} · ${IP.str(IP.mask(x.p))}`, `<b>${IP.str(x.net)}</b>`, `${IP.str(x.first)} → ${IP.str(x.lastHost)}`, IP.str(x.bc) + (x.fits ? '' : ' ⚠️')
        ]), { mono: [3, 4, 5, 6] }) +
        `<p class="small muted mb0">Règle : pour chaque besoin, plus petite puissance de 2 ≥ hôtes + 2 ; on trie du plus grand au plus petit et on attribue à la suite.</p>`;
    };
    el.querySelector('[data-b]').addEventListener('input', render);
    el.querySelector('[data-n]').addEventListener('input', render);
    render();
  });

  /* ---------- Agrégation (résumé de routes) ---------- */
  W.register('summ', (el, d) => {
    el.classList.add('widget');
    el.innerHTML = `
      <div class="w-h">🧲 Agrégation de routes — bits communs en couleur</div>
      <textarea class="input mono" rows="4" data-n>${U.esc(d.nets || '172.16.8.0/24\n172.16.9.0/24\n172.16.10.0/24\n172.16.11.0/24')}</textarea>
      <div data-out class="mt1"></div>`;
    const render = () => {
      const list = el.querySelector('[data-n]').value.split(/[\n,;]+/).map((s) => s.trim()).filter(Boolean).map((s) => {
        const m = s.match(/^(\d+\.\d+\.\d+\.\d+)\/(\d{1,2})$/);
        return m && IP.parse(m[1]) != null ? { net: IP.network(IP.parse(m[1]), +m[2]), p: +m[2] } : null;
      }).filter(Boolean);
      const out = el.querySelector('[data-out]');
      if (list.length < 2) { out.innerHTML = '<p class="small muted">Entre au moins deux réseaux (un par ligne).</p>'; return; }
      const s = IP.summarize(list);
      out.innerHTML = list.map((r) => `<div class="binrow"><span class="lab mono">${IP.str(r.net)}/${r.p}</span><span>${bits(r.net, s.p, { sm: true })}</span><span></span></div>`).join('') +
        `<div class="co ${s.exact ? 'key' : 'trap'} mt1"><div class="co-h">${s.exact ? '✅ Résumé exact' : '⚠️ Sur-agrégation'}</div>
        <b>${s.p}</b> bits communs → route résumée <b class="mono">${IP.str(s.net)}/${s.p}</b> (${IP.str(IP.mask(s.p))}).
        ${s.exact ? 'Elle couvre exactement les réseaux donnés.' : `Elle couvre ${U.fmtNum(IP.size(s.p))} adresses alors que les réseaux n'en font que ${U.fmtNum(U.sum(list.map((r) => IP.size(r.p))))} : elle annonce des réseaux qui ne sont pas derrière ce routeur (risque de trou noir).`}</div>`;
    };
    el.querySelector('[data-n]').addEventListener('input', render);
    render();
  });

  /* ---------- Outil IPv6 (compression, type, EUI-64) ---------- */
  W.register('ipv6', (el, d) => {
    el.classList.add('widget');
    el.innerHTML = `
      <div class="w-h">🛰️ Atelier IPv6</div>

      <div data-out></div>`;
    const bid = (s) => [s.prio, s.mac.toLowerCase().replace(/[^0-9a-f]/g, '')];
    const cmp = (x, y) => { const a = bid(x), b = bid(y); return a[0] - b[0] || (a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0); };

  /* ---------- Simulateur d'ACL Cisco ---------- */
  function parseAddr(tok, i) {
    // retourne [ {net, wild} , nextIndex ]
    const t = tok[i];
    if (t === 'any') return [{ net: 0, wild: 0xffffffff }, i + 1];
    if (t === 'host') return [{ net: IP.parse(tok[i + 1]), wild: 0 }, i + 2];
    const a = IP.parse(t);
    const w = IP.parse(tok[i + 1] || '');
    if (a != null && w != null && /^\d/.test(tok[i + 1])) return [{ net: a, wild: w }, i + 2];
    if (a != null) return [{ net: a, wild: 0 }, i + 1];
    throw new Error('adresse illisible : ' + t);
  }
  const matchAddr = (spec, ip) => ((ip & ~spec.wild) >>> 0) === ((spec.net & ~spec.wild) >>> 0);
  const PORTS = { www: 80, http: 80, https: 443, ssh: 22, telnet: 23, smtp: 25, domain: 53, ftp: 21, 'ftp-data': 20, bootps: 67, bootpc: 68, tftp: 69, ntp: 123, snmp: 161 };
  function parseLine(line) {
    let tok = line.trim().replace(/\s+/g, ' ').split(' ');
    if (tok[0] === 'access-list') {
      const num = +tok[1];
      tok = tok.slice(2);
      tok.std = num >= 1 && num <= 99 || num >= 1300 && num <= 1999;
    }
    const action = tok[0];
    if (action !== 'permit' && action !== 'deny') return null;
    const rule = { action, raw: line.trim() };
    let i = 1;
    const protos = ['ip', 'tcp', 'udp', 'icmp'];
    if (!protos.includes(tok[1])) {
      // standard
      const [src] = parseAddr(tok, 1);
      rule.std = true; rule.src = src;
      return rule;
    }
    rule.proto = tok[1]; i = 2;
    let r1 = parseAddr(tok, i); rule.src = r1[0]; i = r1[1];
    if (tok[i] === 'eq') { rule.sport = PORTS[tok[i + 1]] || +tok[i + 1]; i += 2; }
    let r2 = parseAddr(tok, i); rule.dst = r2[0]; i = r2[1];
    if (tok[i] === 'eq') { rule.dport = PORTS[tok[i + 1]] || +tok[i + 1]; i += 2; }
    if (tok[i] === 'established') rule.est = true;
    return rule;
  }
  W.register('aclsim', (el, d) => {
    el.classList.add('widget');
    el.innerHTML = `
      <div class="w-h">🧱 Simulateur d'ACL — lecture de haut en bas, première correspondance</div>
      <label class="lbl">ACL (syntaxe Cisco, une règle par ligne)</label>
      <textarea class="input mono" rows="6" data-acl>${U.esc(d.acl || 'permit tcp any host 10.20.3.194 eq 80\npermit tcp any host 10.20.3.194 eq 443\npermit tcp 10.20.0.0 0.0.1.255 10.20.3.192 0.0.0.31 eq 22\ndeny ip any any')}</textarea>
      <div class="grid c4 mt1">
        <div><label class="lbl">IP source</label><input class="input mono" data-s value="41.203.10.5"></div>
        <div><label class="lbl">IP destination</label><input class="input mono" data-d value="10.20.3.194"></div>
        <div><label class="lbl">Protocole</label><select class="input" data-p><option>tcp</option><option>udp</option><option>icmp</option></select></div>
        <div><label class="lbl">Port destination</label><input class="input mono" data-port value="22"></div>
      </div>
      <div data-out class="mt1"></div>`;
    const render = () => {
      const lines = el.querySelector('[data-acl]').value.split('\n').filter((l) => l.trim() && !l.trim().startsWith('!'));
      const src = IP.parse(el.querySelector('[data-s]').value), dst = IP.parse(el.querySelector('[data-d]').value);
      const proto = el.querySelector('[data-p]').value, port = +el.querySelector('[data-port]').value;
      const out = el.querySelector('[data-out]');
      if (src == null || dst == null) { out.innerHTML = '<p class="ko-t small">Adresses invalides.</p>'; return; }
      let hit = -1, rows = [], err = null;
      lines.forEach((l, k) => {
        let r = null;
        try { r = parseLine(l); } catch (e) { err = e.message; }
        let m = false;
        if (r && hit < 0) {
          if (r.std) m = matchAddr(r.src, src);
          else {
            m = (r.proto === 'ip' || r.proto === proto) && matchAddr(r.src, src) && matchAddr(r.dst, dst) && (r.dport == null || (proto !== 'icmp' && r.dport === port)) && !r.est;
          }
          if (m) hit = k;
        }
        rows.push(`<div class="mono small" style="padding:.3rem .5rem;border-radius:8px;margin:2px 0;${k === hit ? `background:${r.action === 'permit' ? 'var(--ok-soft)' : 'var(--ko-soft)'};font-weight:800` : hit >= 0 && k > hit ? 'opacity:.4' : ''}">${k + 1}. ${U.esc(l.trim())}${!r ? ' <span class="ko-t">(ignorée)</span>' : ''}${k === hit ? ' ← correspondance' : ''}</div>`);
      });

(function () {

  /* Conversion octale → chaîne symbolique (avec s/S/t/T) */
  function symbolic(oct, isDir) {
    const n = parseInt(oct, 8);
    const sp = (n >> 9) & 7, u = (n >> 6) & 7, g = (n >> 3) & 7, o = n & 7;

    const U3 = tri(u), G3 = tri(g), O3 = tri(o);
    if (sp & 4) U3[2] = u & 1 ? 's' : 'S';
    if (sp & 2) G3[2] = g & 1 ? 's' : 'S';
    if (sp & 1) O3[2] = o & 1 ? 't' : 'T';
    return (isDir ? 'd' : '-') + U3.join('') + G3.join('') + O3.join('');
  }
  App.sys = { symbolic };

  W.register('chmod', (el) => {
    el.classList.add('widget');
    const who = ['Propriétaire (u)', 'Groupe (g)', 'Autres (o)'];

      <div class="row">
        <label class="switch"><input type="checkbox" data-sp="4"> SUID (4000)</label>
        <label class="switch"><input type="checkbox" data-sp="2"> SGID (2000)</label>
        <label class="switch"><input type="checkbox" data-sp="1"> Sticky (1000)</label>
        <label class="switch"><input type="checkbox" data-dir> Dossier</label>

        <div class="grow"><div class="tiny muted">Affichage ls -l</div><div class="bignum" style="font-size:1.7rem" data-sym></div></div>

      return (sp ? String(sp) : '') + t.join('');

    if (mon !== '*') parts.push(`en ${fieldFr(mon, 'mois', MOIS)}`);
    if (dow !== '*') parts.push(`(${fieldFr(dow, 'jours', JOURS)})`);
    if (dom === '*' && dow === '*') parts.push('tous les jours');
    return { text: parts.join(' '), cmd };
  }

/* Générateurs d'exercices infinis : binaire, hexadécimal, masques, sous-réseaux, VLSM, agrégation, IPv6.

(function () {
  'use strict';
  const App = window.App;
  const U = App.util;
  const IP = App.ip;
  const V6 = IP.v6;
  const G = App.gen;
  const md = App.md;
  const POW = [128, 64, 32, 16, 8, 4, 2, 1];
  const S = IP.str;
  const NAMES = ['1er', '2e', '3e', '4e'];

  App.quiz.fieldCheckers.v6full = (v, f) => {
    const s = String(v).trim().toLowerCase();
    return /^([0-9a-f]{4}:){7}[0-9a-f]{4}$/.test(s) && s === String(f.a).toLowerCase();
  };

  const subSteps = (n) => {
    let r = n;
    const out = [];
    POW.forEach((w) => {
      if (r >= w) { out.push(`${r} ≥ ${w} → <b>1</b>, reste ${r - w}`); r -= w; }
      else out.push(`<span class="muted">${r} &lt; ${w} → 0</span>`);
    });
    return out;
  };
  const weightsTable = (n) => md.table(POW.map(String), [IP.bin8(n).split('').map((b) => (b === '1' ? '<b class="pri-t">1</b>' : '<span class="muted">0</span>'))]);
  const binRow = (lab, n, p) => `<div class="binrow"><span class="lab">${lab}</span><span>${App.ui.bits32(n, p, { sm: true })}</span><span class="dec">${S(n)}</span></div>`;

  function magic(a, p) {
    const c = IP.calc(a, p);
    if (p % 8 === 0) {
      return `<p>Masque aligné sur l'octet (/${p}) : les ${p / 8} premier(s) octet(s) = réseau. Réseau <b>${S(c.net)}</b>, broadcast <b>${S(c.bc)}</b>.</p>`;
    }
    const o = c.oct, mv = IP.octets(c.mask)[o], b = 256 - mv, v = IP.octets(a)[o], netO = Math.floor(v / b) * b;
    return md.steps([
      `/${p} → masque <b>${S(c.mask)}</b> : l'octet intéressant est le <b>${NAMES[o]}</b> (valeur ${mv}).`,
      `Bloc = 256 − ${mv} = <b class="acc-t">${b}</b>.`,
      `${v} est entre ${netO} et ${netO + b} → réseau = <b>${S(c.net)}</b>${o < 3 ? ' (octets suivants à 0)' : ''}.`,
      `Broadcast = ${netO} + ${b} − 1 = ${netO + b - 1}${o < 3 ? ' (octets suivants à 255)' : ''} → <b>${S(c.bc)}</b>.`,
      `1er hôte = réseau + 1 = <b>${S(c.first)}</b> · dernier = broadcast − 1 = <b>${S(c.last)}</b>.`,
      `Hôtes = 2<sup>${32 - p}</sup> − 2 = <b>${U.fmtNum(c.hosts)}</b>.`
    ]) + binRow('Adresse', a, p) + binRow('Réseau', c.net, p) + binRow('Broadcast', c.bc, p);
  }

  function randAddr(r, p, kind) {
    kind = kind || r.pick(['10', '172', '192', 'pub']);

        const base = IP.network(randAddr(r, p - k, r.pick(['10', '172'])), p - k);
        list = Array.from({ length: n }, (_, i) => ({ net: (base + i * size) >>> 0, p }));
      } else {
        const pre = r.pick(['192.168', '172.16', '10.10']);
        const start = r.int(0, 60) * 4 + r.pick([1, 2]);
        const n = r.int(2, 3);
        list = Array.from({ length: n }, (_, i) => ({ net: IP.parse(`${pre}.${start + i}.0`), p: 24 }));
        askExact = true;
      }
      const s = IP.summarize(list);
      const fields = [{ label: 'Route résumée', kind: 'cidr', a: `${S(s.net)}/${s.p}`, ph: 'a.b.c.d/n' }];
      if (askExact) fields.push({ label: 'Résumé exact ?', kind: 'select', opts: ['Oui, exact', 'Non, il englobe d\'autres réseaux'], a: s.exact ? 0 : 1 });
      const o = IP.interesting(Math.min(32, s.p + 1));
      return {
        q: `Quelle est la route résumée la plus précise pour : ${list.map((x) => `<b class="mono">${S(x.net)}/${x.p}</b>`).join(' · ')} ?`,
        fields,
        expl: md.steps([
          `On écrit en binaire l'octet qui change (le ${NAMES[o]}) : ${list.map((x) => `${IP.octets(x.net)[o]} = <span class="mono">${IP.bin8(IP.octets(x.net)[o])}</span>`).join(' · ')}.`,
          `On compte les bits communs depuis la gauche : <b>${s.p}</b> bits.`,
          `Route résumée = bits communs, le reste à 0 → <b class="mono">${S(s.net)}/${s.p}</b>.`
        ]) + list.map((x) => binRow(S(x.net), x.net, s.p)).join('') + (s.exact ? md.key(`Résumé exact : ${list.length} réseaux = 2<sup>${Math.log2(list.length) | 0}</sup>, et le premier est aligné.`) : md.trap(`Sur-agrégation : /${s.p} couvre aussi des réseaux absents. Un résumé exact couvre 2<sup>n</sup> réseaux et commence sur un multiple de 2<sup>n</sup>.`))
      };
    }
  });

  /* ---------------- VLSM ---------------- */
  G.register({
    id: 'vlsm', mod: 's1', icon: '🏗️', title: 'Plan VLSM',
    desc: 'Établir un plan d\'adressage complet du plus grand au plus petit.',
    make(r, lvl) {
      const baseP = lvl === 3 ? r.pick([22, 23]) : 24;
      const total = IP.size(baseP);
      const nLan = lvl === 1 ? 3 : 4;
      const nWan = lvl === 1 ? 1 : lvl === 2 ? 2 : 3;
      let sizes;
      for (let tries = 0; tries < 200; tries++) {
        const pool = lvl === 3 ? [512, 256, 128, 64, 32, 16] : [128, 64, 32, 16, 8];
        sizes = r.shuffle(pool).slice(0, nLan).sort((a, b) => b - a);
        if (U.sum(sizes) + 4 * nWan <= total && U.sum(sizes) + 4 * nWan > total * 0.55) break;
      }
      const names = r.shuffle(['Agents', 'Trésor', 'Impôts', 'Budget', 'Direction', 'Wi-Fi invités', 'Serveurs', 'Douanes', 'DRH', 'Comptabilité']);
      const needs = sizes.map((sz, i) => ({ name: 'LAN ' + names[i], hosts: r.int(sz / 2 - 1, sz - 2) }));
      for (let w = 0; w < nWan; w++) needs.push({ name: 'WAN ' + (w + 1), hosts: 2 });
      const site = r.pick(['Agadez', 'Maradi', 'Dosso', 'Tillabéri', 'Diffa', 'Zinder', 'Tahoua']);
      const third = r.int(0, 60) * (baseP === 24 ? 1 : 4);
      const base = IP.parse(`172.${r.int(16, 31)}.${third}.0`);
      const plan = IP.vlsm(base, baseP, needs);
      const listed = r.shuffle(needs.map((n, i) => i));
      const byName = {};
      plan.plan.forEach((x) => (byName[x.name] = x));
      return {
        q: `Site de <b>${site}</b>, bloc <b class="mono">${S(base)}/${baseP}</b>. Besoins (passerelle comprise) : ${listed.map((i) => `<b>${needs[i].name}</b> ${needs[i].hosts}`).join(' · ')}.<br><span class="small muted">Attribue du plus grand au plus petit, à la suite, depuis le début du bloc (à taille égale : WAN 1, puis 2…). Donne chaque réseau en notation a.b.c.d/n.</span>`,
        fields: needs.map((n) => ({ label: n.name + ' (' + n.hosts + ')', kind: 'cidr', a: `${S(byName[n.name].net)}/${byName[n.name].p}`, ph: 'a.b.c.d/n' })),
        expl: md.steps([
          'Pour chaque besoin : plus petite puissance de 2 ≥ hôtes + 2 → préfixe.',
          'Trier du plus grand au plus petit (les WAN /30 à la fin).',
          'Attribuer à la suite : chaque réseau commence juste après le broadcast du précédent.'
        ]) + md.table(['Réseau', 'Besoin', 'Taille', 'Réseau/préfixe', 'Plage', 'Broadcast'], plan.plan.map((x) => [x.name, x.hosts, x.size, `<b>${S(x.net)}/${x.p}</b>`, `${S(x.first)} → ${S(x.lastHost)}`, S(x.bc)]), { mono: [3, 4, 5] }) +
          `<p class="small">Total : ${U.fmtNum(plan.used)} / ${U.fmtNum(total)} adresses — libres à partir de <b class="mono">${S(plan.next)}</b>.</p>`
      };
    }
  });

  /* ---------------- Wildcard / ACL ---------------- */
  G.register({
    id: 'wildcard', mod: 's1', icon: '🃏', title: 'Masque générique (ACL / OSPF)',
    desc: 'Calculer le wildcard et écrire la ligne d\'ACL ou de network OSPF.',
    make(r, lvl) {
      const p = lvl === 1 ? r.int(24, 30) : r.int(16, 29);
      const net = IP.network(randAddr(r, p, r.pick(['10', '172', '192'])), p);
      if (lvl < 3) return {
        q: `Masque générique (wildcard) pour le réseau <b class="mono">${S(net)}/${p}</b> ?`,
        fields: [{ kind: 'ip', a: S(IP.wild(p)) }],
        expl: md.f(`255.255.255.255 − ${S(IP.mask(p))} = <b>${S(IP.wild(p))}</b>`)
      };
      return {
        q: `Complète : <code>access-list 10 permit … …</code> pour autoriser tout le réseau <b class="mono">${S(net)}/${p}</b>.`,
        fields: [{ label: 'Adresse', kind: 'ip', a: S(net) }, { label: 'Wildcard', kind: 'ip', a: S(IP.wild(p)) }],
        expl: md.code(`access-list 10 permit ${S(net)} ${S(IP.wild(p))}\n! même logique pour OSPF :\nrouter ospf 1\n network ${S(net)} ${S(IP.wild(p))} area 0`) + md.tip('<code>host 10.1.1.1</code> = 10.1.1.1 0.0.0.0 · <code>any</code> = 0.0.0.0 255.255.255.255.')
      };
    }
  });

  /* ---------------- IPv6 ---------------- */
  function randV6(r) {
    const arr = [0x2001, 0x0db8, r.int(0, 0xffff), r.int(0, 0xffff), r.int(0, 0xffff), r.int(0, 0xffff), r.int(0, 0xffff), r.int(1, 0xffff)];
    // une longue suite de zéros
    const runLen = r.int(2, 4), runStart = r.int(2, 7 - runLen);
    for (let i = runStart; i < runStart + runLen; i++) arr[i] = 0;
    // un zéro isolé parfois
    if (r.chance(0.5)) { const i = r.pick([2, 3, 4, 5, 6].filter((x) => x < runStart - 1 || x > runStart + runLen)); if (i != null) arr[i] = 0; }
    // valeurs à zéros de tête
    for (let i = 2; i < 8; i++) if (arr[i] && r.chance(0.5)) arr[i] = r.int(1, 0xff);
    if (r.chance(0.3)) arr[0] = r.pick([0xfe80, 0xfd12, 0x2001, 0x2a02]);
    if (arr[0] === 0xfe80) arr[1] = 0;
    return arr;
  }

  G.register({
    id: 'v6-compress', mod: 's1', icon: '🗜️', title: 'IPv6 : compresser',
    desc: 'Supprimer les 0 de tête, remplacer la plus longue suite de 0 par « :: ».',
    make(r) {
      const a = randV6(r);
      const full = V6.full(a);
      const shown = r.chance(0.5) ? full.toUpperCase() : full;
      return {
        q: `Écris la forme compressée de <b class="mono">${shown}</b>.`,
        fields: [{ kind: 'v6', strict: true, a: V6.compress(a), ph: 'ex. 2001:db8::1' }],
        expl: md.steps([
          `Supprimer les 0 de tête de chaque groupe : <span class="mono">${a.map((h) => h.toString(16)).join(':')}</span>`,
          'Remplacer <b>une seule</b> suite de groupes nuls (la plus longue ; à égalité, la première) par <b>::</b>.',
          `→ <b class="mono">${V6.compress(a)}</b>`
        ]) + md.trap('Un groupe nul isolé s\'écrit « 0 » ; « :: » ne s\'utilise qu\'une fois.')
      };
    }
  });

  G.register({
    id: 'v6-expand', mod: 's1', icon: '📏', title: 'IPv6 : développer',
    desc: 'Retrouver les 8 groupes de 4 chiffres hexadécimaux.',
    make(r) {
      const a = randV6(r);
      return {
        q: `Développe entièrement <b class="mono">${V6.compress(a)}</b> (8 groupes de 4 chiffres).`,
        fields: [{ kind: 'v6full', a: V6.full(a), wide: true, ph: 'xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx', show: V6.full(a) }],
        expl: `<p>On compte les groupes présents : ${V6.compress(a).split('::').map((s) => (s ? s.split(':').length : 0)).reduce((x, y) => x + y, 0)} → « :: » remplace ${8 - V6.compress(a).split('::').map((s) => (s ? s.split(':').length : 0)).reduce((x, y) => x + y, 0)} groupe(s) de 0000. Puis on complète chaque groupe à 4 chiffres.</p><p class="mono"><b>${V6.full(a)}</b></p>`
      };
    }
  });

  G.register({
    id: 'v6-type', mod: 's1', icon: '🛰️', title: 'IPv6 : type d\'adresse',
    desc: 'Global, lien local, ULA, multicast, bouclage…',
    make(r) {
      const opts = [
        ['Unicast global (2000::/3)', () => r.pick(['2001:db8:', '2a02:4780:', '2c0f:f8f0:', '2001:470:']) + r.int(1, 0xfff).toString(16) + '::' + r.int(1, 0xff).toString(16)],
        ['Lien local (fe80::/10)', () => 'fe80::' + r.int(1, 0xffff).toString(16) + ':' + r.int(1, 0xffff).toString(16)],
        ['ULA, ≈ privée (fc00::/7)', () => 'fd' + r.int(0, 0xff).toString(16).padStart(2, '0') + ':' + r.int(1, 0xffff).toString(16) + '::' + r.int(1, 99)],
        ['Multicast (ff00::/8)', () => r.pick(['ff02::1', 'ff02::2', 'ff02::5', 'ff02::1:2', 'ff05::2'])],
        ['Bouclage (::1)', () => '::1'],
        ['Non spécifiée (::)', () => '::']
      ];
      const i = r.int(0, 3) + (r.chance(0.15) ? 2 : 0);
      const addr = opts[Math.min(i, 5)][1]();
      const t = V6.type(V6.parse(addr));
      const map = { gua: 0, doc: 0, ll: 1, ula: 2, mcast: 3, loop: 4, unspec: 5 };
      const extra = { 'ff02::1': ' — tous les nœuds du lien', 'ff02::2': ' — tous les routeurs', 'ff02::5': ' — routeurs OSPF', 'ff02::1:2': ' — serveurs/relais DHCPv6' };
      return {
        type: 'qcm', noShuffle: true,
        q: `Type de l'adresse <b class="mono">${addr}</b> ?`,
        choices: opts.map((o) => o[0]),
        a: map[t.key],
        expl: `<p><b>${t.label}${extra[addr] || ''}</b>.</p>` + md.table(['Préfixe', 'Type'], [['2000::/3', 'Unicast global (routable)'], ['fe80::/10', 'Lien local (toujours présente, non routée)'], ['fc00::/7 (fd00::/8)', 'ULA ≈ adresses privées'], ['ff00::/8', 'Multicast (pas de broadcast en IPv6)'], ['::1/128 · ::/128', 'Bouclage · non spécifiée']])
      };
    }
  });

  G.register({
    id: 'v6-eui64', mod: 's1', icon: '🧬', title: 'IPv6 : EUI-64',
    desc: 'Fabriquer l\'identifiant d\'interface à partir de la MAC.',
    make(r) {
      const mac = [r.pick([0x00, 0x00, 0x0c, 0x3c, 0xa4, 0x52, 0x08]), r.int(0, 255), r.int(0, 255), r.int(0, 255), r.int(0, 255), r.int(0, 255)];
      const macS = mac.map(V6.hex2).join(':').toUpperCase();
      const pfx = [0x2001, 0x0db8, r.int(1, 0xfff), r.int(0, 0xff)];
      const e = V6.eui64(macS);
      const addr = V6.compress(pfx.concat(e.hextets));
      return {
        q: `Calcule l'adresse EUI-64 de l'interface de MAC <b class="mono">${macS}</b> dans le réseau <b class="mono">${V6.compress(pfx.concat([0, 0, 0, 0]))}/64</b>.`,
        fields: [{ kind: 'v6', a: addr, wide: true, ph: '2001:db8:…' }],
        expl: md.steps([
          `Insérer FF:FE au milieu : <span class="mono">${e.withFFFE.map(V6.hex2).join(':')}</span>`,
          `Inverser le 7<sup>e</sup> bit du 1<sup>er</sup> octet : ${V6.hex2(mac[0])} = <span class="mono">${IP.bin8(mac[0])}</span> → <span class="mono">${IP.bin8(e.flipped[0])}</span> = ${V6.hex2(e.flipped[0])}`,
          `Identifiant : <span class="mono">${e.hextets.map((h) => h.toString(16)).join(':')}</span> → adresse <b class="mono">${addr}</b>`
        ]) + md.tip('00 → 02, 02 → 00, 0C → 0E, 3C → 3E, A4 → A6 : on ajoute ou retire 2 au 1er octet.')
      };
    }
  });

  G.register({
    id: 'v6-sub', mod: 's1', icon: '🧩', title: 'IPv6 : découpage /48 → /64',
    desc: 'Nombre de sous-réseaux et n-ième préfixe.',
    make(r, lvl) {
      const h3 = r.int(0x100, 0xfff);
      if (lvl === 1) {
        const p = r.pick([48, 52, 56, 60]);
        return {
          q: `Un site reçoit un préfixe <b>/${p}</b>. Combien de sous-réseaux <b>/64</b> peut-il créer ?`,
          fields: [{ kind: 'num', a: Math.pow(2, 64 - p) }],
          expl: md.f(`2<sup>64 − ${p}</sup> = 2<sup>${64 - p}</sup> = <b>${U.fmtNum(Math.pow(2, 64 - p))}</b>`)
        };
      }
      const k = r.int(2, 40);
      const ans = `2001:db8:${h3.toString(16)}:${(k - 1).toString(16)}::/64`;
      return {
        q: `Préfixe <b class="mono">2001:db8:${h3.toString(16)}::/48</b>. Écris le <b>${k}<sup>e</sup></b> sous-réseau /64 (le 1er est 2001:db8:${h3.toString(16)}::/64).`,
        fields: [{ kind: 'v6', a: ans, wide: true, show: ans }],
        expl: `<p>Le 4<sup>e</sup> groupe (16 bits) numérote les sous-réseaux : indice ${k - 1} = <b>0x${(k - 1).toString(16)}</b> en hexadécimal → <b class="mono">${ans}</b>.</p>${md.trap('Le numéro de sous-réseau s\'écrit en hexadécimal : le 11e sous-réseau est :a:, pas :10:.')}`
      };
    }
  });
})();

</script>
  <script>
/* js/generators/net.js */
/* Générateurs réseau : ports, TCP (séquences, fenêtre), OSPF, choix de route, distance administrative, domaines. */
(function () {
  'use strict';
  const App = window.App;
  const U = App.util;
  const IP = App.ip;
  const G = App.gen;
  const md = App.md;
  const S = IP.str;

  const PORTS = [
    [20, 'FTP (données)', 'TCP'], [21, 'FTP (commandes)', 'TCP'], [22, 'SSH / SFTP / SCP', 'TCP'], [23, 'Telnet', 'TCP'],
    [25, 'SMTP (entre serveurs)', 'TCP'], [53, 'DNS', 'UDP et TCP'], [67, 'DHCP serveur', 'UDP'], [68, 'DHCP client', 'UDP'],
    [69, 'TFTP', 'UDP'], [80, 'HTTP', 'TCP'], [88, 'Kerberos', 'TCP et UDP'], [110, 'POP3', 'TCP'], [123, 'NTP', 'UDP'],
    [143, 'IMAP', 'TCP'], [161, 'SNMP', 'UDP'], [162, 'SNMP trap', 'UDP'], [179, 'BGP', 'TCP'], [389, 'LDAP', 'TCP'],
    [443, 'HTTPS', 'TCP'], [445, 'SMB (partage Windows)', 'TCP'], [465, 'SMTPS', 'TCP'], [500, 'IKE (IPsec)', 'UDP'],
    [514, 'Syslog', 'UDP'], [520, 'RIP', 'UDP'], [587, 'SMTP soumission', 'TCP'], [636, 'LDAPS', 'TCP'], [993, 'IMAPS', 'TCP'],
    [995, 'POP3S', 'TCP'], [1433, 'SQL Server', 'TCP'], [1521, 'Oracle', 'TCP'], [1812, 'RADIUS (authentification)', 'UDP'],
    [1813, 'RADIUS (comptabilité)', 'UDP'], [3268, 'Catalogue global AD', 'TCP'], [3306, 'MySQL', 'TCP'], [3389, 'RDP (bureau à distance)', 'TCP'],
    [4500, 'NAT-T (IPsec)', 'UDP'], [5060, 'SIP', 'UDP et TCP'], [5061, 'SIP sur TLS', 'TCP'], [49, 'TACACS+', 'TCP'], [3260, 'iSCSI', 'TCP']
  ];
  const CORE = [20, 21, 22, 23, 25, 53, 67, 69, 80, 88, 110, 123, 143, 161, 389, 443, 445, 514, 3389, 1812, 500, 5060, 587, 993, 995];
  const PROTO_NUM = [['ICMP', 1], ['TCP', 6], ['UDP', 17], ['GRE', 47], ['ESP', 50], ['AH', 51], ['EIGRP', 88], ['OSPF', 89]];

  G.register({
    id: 'ports', mod: 's4', icon: '🔌', title: 'Ports & protocoles',
    desc: 'Le tableau des ports, en version réflexe.',
    make(r, lvl) {
      const pool = lvl === 1 ? PORTS.filter((p) => CORE.slice(0, 16).includes(p[0])) : lvl === 2 ? PORTS.filter((p) => CORE.includes(p[0])) : PORTS;
      const p = r.pick(pool);
      const mode = lvl === 3 && r.chance(0.25) ? 'proto' : r.pick(['port', 'svc', 'tr']);
      const table = md.table(['Port', 'Service', 'Transport'], [[p[0], p[1], p[2]]]);
      if (mode === 'proto') {
        const x = r.pick(PROTO_NUM);
        return { q: `Quel est le <b>numéro de protocole IP</b> de <b>${x[0]}</b> (champ « Protocole » de l'en-tête IPv4) ?`, fields: [{ kind: 'num', a: x[1] }], expl: md.table(['Protocole', 'N°'], PROTO_NUM.map((y) => [y[0], y[1]])) + md.trap('Ce ne sont pas des ports : ESP (50), AH (51), OSPF (89) n\'utilisent ni TCP ni UDP.') };
      }
      if (mode === 'port') return { q: `Quel port utilise <b>${p[1]}</b> ?`, fields: [{ kind: 'num', a: p[0] }], expl: table };
      if (mode === 'svc') {
        const others = r.shuffle(PORTS.filter((x) => x[0] !== p[0] && x[1] !== p[1])).slice(0, 3);
        const ch = r.shuffle([p].concat(others));
        return { type: 'qcm', q: `Quel service écoute sur le port <b>${p[0]}</b> ?`, choices: ch.map((x) => x[1]), a: ch.indexOf(p), expl: table };
      }
      const opts = ['TCP', 'UDP', 'UDP et TCP'];
      const ans = p[2] === 'TCP et UDP' ? 2 : opts.indexOf(p[2]);
      return { type: 'qcm', noShuffle: true, q: `<b>${p[1]}</b> (port ${p[0]}) utilise quel protocole de transport ?`, choices: opts, a: ans < 0 ? 2 : ans, expl: table + md.tip('UDP : DNS (requêtes), DHCP, TFTP, SNMP, NTP, Syslog, RADIUS, RTP/VoIP. TCP : tout ce qui transfère des fichiers, des pages, des mails, des sessions.') };
    },
    quick(r) {
      const p = r.pick(PORTS.filter((x) => CORE.includes(x[0])));
      return { q: `Port de <b>${p[1]}</b> ?`, fields: [{ kind: 'num', a: p[0] }], expl: `${p[1]} = ${p[0]}/${p[2]}` };
    }
  });

  G.register({
    id: 'tcp-seq', mod: 's4', icon: '🤝', title: 'TCP : séquences et ACK',
    desc: 'Poignée de main, échange de données, numéros à calculer.',
    make(r, lvl) {
      const c = r.int(1, 90) * 100, s = r.int(1, 90) * 100 + 7;
      if (lvl === 1) {
        const which = r.int(2, 3);
        const rows = which === 2 ? { seq: s, ack: c + 1 } : { seq: c + 1, ack: s + 1 };
        return {
          q: `Le client envoie <b>SYN, seq = ${c}</b>. Le serveur a pour numéro initial <b>${s}</b>. Donne seq et ack du segment n°${which} (${which === 2 ? 'SYN-ACK du serveur' : 'ACK final du client'}).`,
          fields: [{ label: 'seq', kind: 'num', a: rows.seq }, { label: 'ack', kind: 'num', a: rows.ack }],
          expl: md.table(['N°', 'Drapeaux', 'seq', 'ack'], [['1', 'SYN', c, '—'], ['2', 'SYN, ACK', s, c + 1], ['3', 'ACK', c + 1, s + 1]]) + md.key('Le SYN compte pour 1 octet : on acquitte x + 1.')
        };
      }
      const q = r.pick([100, 200, 300, 500, 512, 1000]), rr = r.pick([536, 1000, 1460, 1460, 2920]);
      const ask = lvl === 2 ? r.pick(['5', '6']) : 'fin';
      if (ask === 'fin') {
        return {
          q: `Après la poignée de main (client ISN ${c}, serveur ISN ${s}), le client envoie ${q} octets puis le serveur répond ${rr} octets. Le client envoie ensuite un <b>FIN</b>. Quels sont seq et ack de ce FIN ? Quel ack le serveur renverra-t-il ?`,
          fields: [{ label: 'seq du FIN', kind: 'num', a: c + 1 + q }, { label: 'ack du FIN', kind: 'num', a: s + 1 + rr }, { label: 'ack renvoyé par le serveur', kind: 'num', a: c + 1 + q + 1 }],
          expl: `<p>Après les données : client à ${c + 1 + q}, serveur à ${s + 1 + rr}. Le FIN porte seq = <b>${c + 1 + q}</b>, ack = <b>${s + 1 + rr}</b>. Comme le SYN, le <b>FIN compte pour 1</b> → le serveur acquitte <b>${c + q + 2}</b>.</p>`
        };
      }
      const rows = [['4', 'Client → Serveur', c + 1, s + 1, q], ['5', 'Serveur → Client', s + 1, c + 1 + q, rr], ['6', 'Client → Serveur', c + 1 + q, s + 1 + rr, 0]];
      const row = ask === '5' ? rows[1] : rows[2];
      return {
        q: `Poignée de main faite (client ISN ${c}, serveur ISN ${s}). Le client envoie une requête de <b>${q} octets</b> (segment 4), le serveur répond avec <b>${rr} octets</b> (segment 5), le client acquitte (segment 6). Donne seq et ack du segment <b>${ask}</b>.`,

  G.register({

  G.register({

        fields: [{ label: 'Coût direct', kind: 'num', a: dCost }, { label: 'Coût via R2', kind: 'num', a: viaCost }, { label: 'Chemin choisi', kind: 'select', opts: ['Direct', 'Via R2', 'Les deux (partage de charge)'], a: dCost < viaCost ? 0 : dCost > viaCost ? 1 : 2 }],

  G.register({
    id: 'route-pick', mod: 's2', icon: '🧭', title: 'Lire une table de routage',

  G.register({
    id: 'ad-pick', mod: 's2', icon: '⚖️', title: 'Distance administrative',

      if (lvl === 2) return { type: 'qcm', q: `Le réseau 192.168.50.0/24 est appris par ${set.map((x) => '<b>' + x[0] + '</b>').join(', ')}. Quelle route est installée ?`, choices: set.map((x) => x[0]), a: set.indexOf(win), expl: `<p>Même préfixe → la plus petite AD gagne : <b>${win[0]} (${win[1]})</b>.</p>` };

        type: 'qcm',
        q: `Un routeur connaît 192.168.50.0/24 par <b>${win[0]}</b> (AD ${win[1]}) et 192.168.50.0/25 par <b>${lo[0]}</b> (AD ${lo[1]}). Vers où part un paquet pour <b>192.168.50.${r.int(1, 126)}</b> ?`,

  G.register({
    id: 'domains', mod: 's3', icon: '🧩', title: 'Domaines de collision et de broadcast',
    desc: 'Compter les domaines selon hubs, switchs, routeurs, VLAN.',
    make(r, lvl) {

      let coll = 0, bc = 0;
      const desc = [];
      for (let i = 0; i < nIf; i++) {

          const vlans = lvl === 3 && r.chance(0.6) ? r.int(2, 3) : 1;

        }

      return {
        q: `Un routeur a ${nIf} interfaces utilisées : ${desc.join(' ; ')}. Combien de domaines de collision et de broadcast ?`,

      };
    }
  });
})();

  <script>
/* js/generators/telecom.js */
/* Générateurs télécoms : décibels, bilan de liaison, Shannon, Nyquist, VoIP, MIC / E1, bilan optique. */
(function () {
  'use strict';
  const App = window.App;
  const U = App.util;
  const G = App.gen;
  const md = App.md;
  const log2 = Math.log2;

  G.register({
    id: 'db', mod: 's6', icon: '📡', title: 'Décibels sans calculatrice',
    desc: '+3 dB = ×2, +10 dB = ×10, dBm ↔ mW.',
    make(r, lvl) {
      if (lvl === 1) {
        const x = r.pick([[3, 2], [6, 4], [9, 8], [10, 10], [13, 20], [16, 40], [20, 100], [23, 200], [30, 1000], [40, 10000]]);
        const neg = r.chance(0.3);
        return {
          q: neg ? `Une perte de <b>${x[0]} dB</b> divise la puissance par combien ?` : `Un gain de <b>${x[0]} dB</b> multiplie la puissance par combien ?`,
          fields: [{ kind: 'num', a: x[1] }],
          expl: md.f(`${x[0]} dB = ${Math.floor(x[0] / 10) ? Math.floor(x[0] / 10) + ' × 10 dB' : ''}${Math.floor(x[0] / 10) && x[0] % 10 ? ' + ' : ''}${x[0] % 10 ? (x[0] % 10) / 3 + ' × 3 dB' : ''} → ${neg ? '÷' : '×'} <b class="hl">${U.fmtNum(x[1])}</b>`) + md.key('+3 dB = ×2 · +10 dB = ×10 · les dB s\'additionnent quand les rapports se multiplient.')
        };
      }
      if (lvl === 2) {
        const x = r.pick([[0, '1 mW', 1], [10, '10 mW', 10], [20, '100 mW', 100], [30, '1 W', 1000], [-10, '0,1 mW', 0.1], [-20, '0,01 mW', 0.01], [-30, '1 µW', 0.001], [3, '2 mW', 2], [13, '20 mW', 20], [23, '200 mW', 200], [33, '2 W', 2000], [27, '500 mW', 500]]);
        return {
          q: `Convertis <b>${x[0]} dBm</b> en milliwatts (mW).`,
          fields: [{ kind: 'num', a: x[2], rel: 0.03, show: x[1] }],
          expl: md.f(`P = 10<sup>${x[0]}/10</sup> mW = <b class="hl">${x[1]}</b>`) + md.tip('0 dBm = 1 mW ; chaque +10 dBm multiplie par 10 ; +3 dBm double ; 27 dBm = 30 − 3 → 1 W ÷ 2 = 500 mW.')
        };
      }
      const pe = r.pick([20, 23, 27, 30]), l1 = r.int(1, 6), g = r.pick([0, 10, 15]), l2 = r.int(2, 9);
      const res = pe - l1 + g - l2;
      return {
        q: `Un émetteur de <b>${pe} dBm</b> traverse un câble (−${l1} dB), un amplificateur (+${g} dB) puis un répartiteur (−${l2} dB). Puissance de sortie en dBm ?`,
        fields: [{ kind: 'num', a: res }],
        expl: md.f(`${pe} − ${l1} + ${g} − ${l2} = <b class="hl">${res} dBm</b>`) + md.key('En dB, on additionne les gains et on soustrait les pertes : pas de multiplication.')
      };
    },
    quick(r) {
      const x = r.pick([[3, 2], [10, 10], [20, 100], [30, 1000], [13, 20], [6, 4]]);
      return { q: `+${x[0]} dB = puissance × ?`, fields: [{ kind: 'num', a: x[1] }], expl: '×' + x[1] };
    }
  });

  G.register({
    id: 'budget', mod: 's6', icon: '🗼', title: 'Bilan de liaison',
    desc: 'Puissance reçue et marge (radio ou fibre).',
    make(r, lvl) {
      if (lvl === 3) {
        const km = r.pick([10, 20, 25, 40, 50, 60]), att = r.pick([0.25, 0.2, 0.35]), con = 2, sp = r.int(2, 10), pe = r.pick([0, -3, 3]), sens = r.pick([-28, -30, -24]);
        const loss = km * att + con * 0.5 + sp * 0.1, pr = pe - loss;
        return {
          q: `Fibre monomode de <b>${km} km</b> (${U.fmtNum(att)} dB/km), 2 connecteurs (0,5 dB chacun), ${sp} épissures (0,1 dB chacune). Émetteur ${pe} dBm, sensibilité ${sens} dBm. Puissance reçue et marge ?`,
          fields: [{ label: 'P reçue (dBm)', kind: 'num', a: Math.round(pr * 100) / 100, tol: 0.05 }, { label: 'Marge (dB)', kind: 'num', a: Math.round((pr - sens) * 100) / 100, tol: 0.05 }],
          expl: md.steps([`Fibre : ${km} × ${U.fmtNum(att)} = ${U.fmtNum(km * att)} dB`, `Connecteurs : 2 × 0,5 = 1 dB · épissures : ${sp} × 0,1 = ${U.fmtNum(sp * 0.1)} dB`, `Pertes totales = ${U.fmtNum(loss)} dB → P reçue = ${pe} − ${U.fmtNum(loss)} = <b>${U.fmtNum(pr)} dBm</b>`, `Marge = ${U.fmtNum(pr)} − (${sens}) = <b>${U.fmtNum(pr - sens)} dB</b>`])
        };
      }
      const pe = r.pick([20, 23, 27, 30]), ge = r.pick([15, 20, 25, 30]), gr = ge, lc = r.int(1, 3), lp = r.int(110, 145), sens = r.pick([-70, -75, -80, -85]);
      const pr = pe + ge + gr - 2 * lc - lp, m = pr - sens;
      return {
        q: `Faisceau hertzien : puissance émise <b>${pe} dBm</b>, antennes <b>${ge} dBi</b> de chaque côté, pertes câbles <b>${lc} dB</b> de chaque côté, affaiblissement de propagation <b>${lp} dB</b>, sensibilité du récepteur <b>${sens} dBm</b>.`,
        fields: [{ label: 'P reçue (dBm)', kind: 'num', a: pr }, { label: 'Marge (dB)', kind: 'num', a: m }, { label: 'Conclusion', kind: 'select', opts: ['Viable (marge ≥ 10 dB)', 'Fragile (0 à 10 dB)', 'Impossible (marge < 0)'], a: m >= 10 ? 0 : m >= 0 ? 1 : 2 }],
        expl: md.f(`P<sub>r</sub> = ${pe} + ${ge} + ${gr} − ${lc} − ${lc} − ${lp} = <b class="hl">${pr} dBm</b>`) + md.f(`Marge = ${pr} − (${sens}) = <b class="hl">${m} dB</b>`) + md.key('On vise une marge ≥ 10 dB (pluie, vent de sable, vieillissement).')
      };
    }
  });

  G.register({
    id: 'shannon', mod: 's6', icon: '📶', title: 'Shannon & Nyquist',
    desc: 'Capacité d\'un canal, débit, bauds.',
    make(r, lvl) {
      if (lvl === 1) {
        const M = r.pick([2, 4, 8, 16, 64, 256]);
        const R = r.pick([1200, 2400, 3200, 4800]);
        return {
          q: `Une modulation à <b>${M} états</b> transmet <b>${U.fmtNum(R)} bauds</b>. Quel est le débit en bit/s ?`,
          fields: [{ kind: 'num', a: R * log2(M) }],
          expl: md.f(`D = R × log<sub>2</sub>(M) = ${U.fmtNum(R)} × ${log2(M)} = <b class="hl">${U.fmtNum(R * log2(M))} bit/s</b>`) + md.tip('log₂ : 2 → 1, 4 → 2, 8 → 3, 16 → 4, 64 → 6, 256 → 8.')
        };
      }
      if (lvl === 2 && r.chance(0.5)) {
        const B = r.pick([3100, 4000, 1000000, 20000000]), M = r.pick([2, 4, 16, 64]);
        const D = 2 * B * log2(M);
        return {
          q: `Canal sans bruit de bande passante <b>${U.fmtNum(B)} Hz</b>, signal à <b>${M} niveaux</b>. Débit maximal (Nyquist) en bit/s ?`,
          fields: [{ kind: 'num', a: D }],
          expl: md.f(`D<sub>max</sub> = 2 × B × log<sub>2</sub>(M) = 2 × ${U.fmtNum(B)} × ${log2(M)} = <b class="hl">${U.fmtNum(D)} bit/s</b>`)
        };
      }
      const B = r.pick([3100, 4000, 1000000, 5000000]), sn = r.pick([10, 20, 30, 40]);
      const lin = Math.pow(10, sn / 10), lg = log2(1 + lin);
      const C = B * lg;
      return {
        q: `Canal de bande passante <b>${U.fmtNum(B)} Hz</b> avec un rapport signal/bruit de <b>${sn} dB</b>. Capacité de Shannon en bit/s ? <span class="small muted">(log₂(1 + ${U.fmtNum(lin)}) ≈ ${U.fmtNum(lg, 2)})</span>`,
        fields: [{ kind: 'num', a: C, rel: 0.02, show: U.fmtNum(Math.round(C)) + ' bit/s' }],
        expl: md.steps([`S/N en linéaire : ${sn} dB → 10<sup>${sn / 10}</sup> = <b>${U.fmtNum(lin)}</b>`, `C = B × log₂(1 + S/N) = ${U.fmtNum(B)} × ${U.fmtNum(lg, 2)} ≈ <b>${U.fmtNum(Math.round(C))} bit/s</b>`]) + md.trap('Toujours convertir les dB en rapport linéaire avant Shannon : 30 dB → 1 000, pas 30.')
      };
    }
  });

  G.register({
    id: 'voip-bw', mod: 's6', icon: '☎️', title: 'Bande passante VoIP',
    desc: 'G.711 = 80 kbit/s, G.729 = 24 kbit/s en IP (20 ms).',
    make(r, lvl) {
      const codec = r.pick([['G.711', 64000], ['G.729', 8000]]);

      if (lvl === 1) return {
        q: `Débit IP d'un appel <b>${codec[0]}</b> avec des paquets toutes les ${ms} ms (en-têtes IP + UDP + RTP = 40 octets), en kbit/s ?`,
        fields: [{ kind: 'num', a: bw }],
        expl: md.steps([`${pps} paquets/s`, `voix = ${U.fmtNum(codec[1])} × ${ms / 1000} ÷ 8 = ${voice} octets`, `paquet = ${voice} + 40 = ${pkt} octets`, `${pkt} × 8 × ${pps} = <b>${U.fmtNum(bw)} kbit/s</b>`])

      const n = r.int(5, 30), cap = r.pick([512, 1024, 2048, 4096]);
      const tot = bw * n;
      return {
        q: `<b>${n} appels</b> simultanés en <b>${codec[0]}</b> (paquets de ${ms} ms) sur une liaison de <b>${U.fmtNum(cap)} kbit/s</b>. Bande passante totale (kbit/s) et pourcentage du lien ?`,
        fields: [{ label: 'Total (kbit/s)', kind: 'num', a: tot, tol: 0.5 }, { label: '% du lien', kind: 'num', a: Math.round((tot / cap) * 100), tol: 1 }],
        expl: md.steps([`1 appel = (${voice} + 40) × 8 × ${pps} = ${U.fmtNum(bw)} kbit/s`, `${n} × ${U.fmtNum(bw)} = <b>${U.fmtNum(tot)} kbit/s</b>`, `${U.fmtNum(tot)} ÷ ${cap} ≈ <b>${Math.round((tot / cap) * 100)} %</b>${tot > cap ? ' → le lien est saturé !' : ''}`])
      };
    }
  });

  G.register({
    id: 'mic', mod: 's6', icon: '🎙️', title: 'MIC, E1, SDH',
    desc: '64 kbit/s, 30 voies par E1, 63 E1 par STM-1.',
    make(r, lvl) {
      if (lvl === 1) {
        const x = r.pick([
          ['Débit d\'un canal téléphonique numérique MIC (kbit/s) ?', 64, '8 000 échantillons/s × 8 bits = 64 kbit/s'],
          ['Combien de voies de voix dans un E1 ?', 30, '32 IT dont IT0 (synchronisation) et IT16 (signalisation) → 30 voies'],
          ['Débit d\'un E1 en kbit/s ?', 2048, '32 × 64 = 2 048 kbit/s'],
          ['Combien d\'E1 dans un STM-1 ?', 63, 'STM-1 = 155,52 Mbit/s = 63 E1'],

        ]);
        return { q: x[0], fields: [{ kind: 'num', a: x[1] }], expl: `<p>${x[2]}.</p>` };
      }
      const calls = r.int(31, 200);
      const e1 = Math.ceil(calls / 30);
      return {
