# Publie l'application sur GitHub Pages (version en ligne installable sur Android, iPhone et ordinateur).
# Prérequis (une seule fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Publier l'application (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construire le fichier unique et le service worker
        run: |
          python3 tools/build_single.py
          cp revision-concours-mef.html app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
